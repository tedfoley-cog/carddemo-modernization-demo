<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>mftb inventory - MONTHLY-InterestCalculation (module CARDDEMO)</title>
<style>

  :root {
    --bg: #edeceb; --card: #ffffff; --ink: #191919; --muted: #626870;
    --line: rgba(25, 25, 25, .13); --hair: rgba(25, 25, 25, .07);
    --wash: #f7f6f5; --accent: #2200ff; --tan: #b9a07a;
    --high: #b3261e; --medium: #8a6a2f; --info: #2200ff; --det: #146c2e;
    --gen: #8a6a2f; --evr: #5b21b6;
    --high-bg: #fdeceb; --medium-bg: #f8f2e6; --info-bg: #ecebff;
    --det-bg: #eaf4ec; --evr-bg: #f2ecfb; --flat-bg: #f1f0ef;
    --sans: "NB International Pro", Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
  header { background: #0f0f0f; color: #fff; padding: 22px 28px 20px;
           border-bottom: 2px solid var(--accent); }
  header .wrap { max-width: 1200px; margin: 0 auto; display: flex; gap: 16px;
                 align-items: flex-start; }
  header .mark { width: 30px; height: 30px; color: #fff; flex: none; margin-top: 3px; }
  header h1 { margin: 0; font-size: 21px; font-weight: 500; letter-spacing: -.015em; }
  header .eyebrow { font: 600 10px/1 var(--mono); letter-spacing: .22em; text-transform: uppercase;
                    color: rgba(255, 255, 255, .5); margin-bottom: 8px; }
  header .sub { color: rgba(255, 255, 255, .5); font: 11px/1.5 var(--mono); margin-top: 6px; }
  main { max-width: 1200px; margin: 0 auto; padding: 26px 28px 80px; }
  a { color: var(--accent); }
  h2 { font: 600 11px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase;
       color: var(--muted); margin: 38px 0 14px; padding-bottom: 8px;
       border-bottom: 1px solid var(--line); }
  h3 { font-size: 13px; font-weight: 600; margin: 22px 0 8px; letter-spacing: -.005em; }
  p.muted, .note { color: var(--muted); }
  .note { font-size: 12px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
          margin: 0 0 10px; }
  .muted { color: var(--muted); }
  table { width: 100%; max-width: 100%; border-collapse: collapse; background: var(--card); }
  th { text-align: left; font: 600 10px/1.4 var(--mono); letter-spacing: .1em;
       text-transform: uppercase; color: var(--muted); background: var(--wash);
       padding: 9px 12px; border-bottom: 1px solid var(--line); }
  td { padding: 9px 12px; border-bottom: 1px solid var(--hair); vertical-align: top;
       overflow-wrap: break-word; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tbody tr:hover td { background: #fbfbfa; }
  tr:last-child td { border-bottom: none; }
  .box { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
         overflow: hidden; }
  code, .mono { font-family: var(--mono); font-size: 12.5px; }
  td code, td.mono, td .mono { overflow-wrap: anywhere; }
  td.mono { min-width: 10ch; }
  /* A narrow window: the wide inventory tables give up padding and letter
     width before they give up fitting, and the card scrolls only if even
     that is not enough, so the page itself never scrolls sideways. */
  @media (max-width: 960px) {
    .box { overflow-x: auto; }
    th, td { padding: 6px 7px; }
    th { font-size: 9.5px; letter-spacing: .04em; }
    td, td code, td .mono { font-size: 11.5px; overflow-wrap: anywhere; }
    td.mono { min-width: 0; }
  }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 6px;
           font: 600 10.5px/1.5 var(--mono); letter-spacing: .04em; text-transform: uppercase;
           color: var(--muted); background: var(--flat-bg);
           border: 1px solid var(--hair); white-space: nowrap; }
  .badge.high, .badge.unresolved, .badge.open, .badge.missing, .badge.missing-proc,
  .badge.external, .badge.mixed, .badge.unplaced, .badge.unsupplied-module,
  .badge.sql-only, .badge.undefined
    { color: var(--high); background: var(--high-bg); border-color: rgba(179, 38, 30, .22); }
  .badge.medium, .badge.gen, .badge.GEN, .badge.derived, .badge.candidate, .badge.partial,
  .badge.proposed, .badge.assumed, .badge.default, .badge.fragment, .badge.include,
  .badge.copybook, .badge.none, .badge.boundary, .badge.schedule
    { color: var(--medium); background: var(--medium-bg); border-color: rgba(185, 160, 122, .4); }
  .badge.info, .badge.job, .badge.chain, .badge.trace, .badge.runtime, .badge.answered,
  .badge.asserted, .badge.data
    { color: var(--info); background: var(--info-bg); border-color: rgba(34, 0, 255, .18); }
  .badge.det, .badge.DET, .badge.program, .badge.agent, .badge.skill, .badge.scanner,
  .badge.resolved, .badge.closed, .badge.bound, .badge.proven, .badge.confirmed,
  .badge.annot, .badge.deterministic, .badge.detected, .badge.present, .badge.dclgen,
  .badge.ddl, .badge.code
    { color: var(--det); background: var(--det-bg); border-color: rgba(20, 108, 46, .22); }
  .badge.evr, .badge.EVR, .badge.human, .badge.launcher, .badge.proc, .badge.inherited,
  .badge.shared, .badge.online
    { color: var(--evr); background: var(--evr-bg); border-color: rgba(91, 33, 182, .18); }
  .empty { color: var(--muted); font-size: 13px; padding: 16px; }
  .request { background: var(--medium-bg); border-left: 2px solid var(--tan); padding: 6px 10px;
             margin-top: 4px; font-size: 12.5px; border-radius: 0 6px 6px 0; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted);
            margin: 8px 2px 0; }
  /* toolbar: text filter + dropdowns + expand/collapse */
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 0 0 12px; }
  .toolbar input, .toolbar select { padding: 6px 10px; border: 1px solid var(--line);
                border-radius: 8px; font-size: 13px; font-family: inherit; background: var(--card);
                color: var(--ink); }
  .toolbar input:focus, .toolbar select:focus { outline: 2px solid rgba(34, 0, 255, .25);
                outline-offset: -1px; border-color: var(--accent); }
  .toolbar input { width: 260px; }
  .toolbar button { padding: 5px 10px; border: 1px solid var(--line); border-radius: 8px;
                    background: var(--card); font: inherit; font-size: 12px; cursor: pointer;
                    color: var(--ink); }
  .toolbar button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .toolbar .count { color: var(--muted); font: 11px/1 var(--mono); margin-left: auto; }
  .toolbar button:disabled { color: var(--muted); cursor: default; }

  /* summary: the counts that open the page */
  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
             gap: 14px; margin: 20px 0 28px; }
  .sgroup { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
            padding: 14px 16px 8px; }
  .sgroup h3 { margin: 0 0 10px; font: 600 10px/1 var(--mono); text-transform: uppercase;
               letter-spacing: .16em; color: var(--muted); }
  .sgroup.wide { grid-column: 1 / -1; }
  .loc { width: 100%; margin-bottom: 6px; }
  .loc th { background: none; border-bottom: 1px solid var(--hair); padding: 4px 18px 6px 0; }
  .loc td { padding: 6px 18px 6px 0; border-bottom: 1px solid var(--hair); white-space: nowrap; }
  .loc td.note, .loc th.note { white-space: normal; width: 100%; padding-right: 0; display: table-cell; }
  .loc td.num, .loc th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .loc td.num.alert, .loc td.num.alert a, .loc td.alert { color: var(--high); font-weight: 600; }
  .loc td.muted { font-size: 12px; }
  .loc tr:hover td { background: none; }
  .loc tr.total td { border-top: 1px solid var(--line); font-weight: 600; }
  tr.missing td { background: var(--high-bg); }
  .closure { background: var(--det-bg); border-left: 2px solid var(--det); padding: 6px 10px;
             margin-top: 4px; font-size: 12.5px; white-space: pre-wrap; border-radius: 0 6px 6px 0; }
  .closure .cite { color: var(--muted); font-family: var(--mono); }
  /* per-group pager: rows inside one collapsible group are paged on their own */
  .gpager { display: flex; gap: 8px; align-items: center; justify-content: flex-end;
            padding: 6px 14px; border-top: 1px solid var(--hair); color: var(--muted);
            font: 11px/1 var(--mono); background: var(--wash); }
  .gpager button { padding: 3px 8px; border: 1px solid var(--line); border-radius: 6px;
                   background: var(--card); font: inherit; cursor: pointer; color: var(--ink); }
  .gpager button:disabled { color: var(--muted); cursor: default; }
  /* collapsible groups */
  details.group { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
                  margin-bottom: 8px; overflow: hidden; }
  details.group > summary { cursor: pointer; padding: 10px 14px; font-weight: 600;
                            list-style: none; display: flex; gap: 10px; align-items: center; }
  details.group > summary::-webkit-details-marker { display: none; }
  details.group > summary::before { content: ''; width: 0; height: 0; border: 4px solid transparent;
                            border-left-color: var(--muted); flex: none; }
  details.group[open] > summary::before { border-left-color: transparent; border-top-color: var(--ink);
                            transform: translateY(2px); }
  details.group > summary .n { color: var(--muted); font: 11px/1 var(--mono); }
  details.group > summary .spacer { flex: 1; }
  details.group.sub { margin: 0; border: none; border-top: 1px solid var(--hair); border-radius: 0; }
  details.group.sub > summary { padding-left: 32px; font-weight: 500; background: var(--wash); }
  details.group table { border-top: 1px solid var(--hair); }
  details.group table th { position: static; }
  /* items: one collapsible card per DB2 table / DSN / external module, paged by the toolbar */
  details.item { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
                 margin-bottom: 6px; overflow: hidden; }
  details.item > summary { cursor: pointer; padding: 9px 14px; list-style: none; display: flex;
                           gap: 8px; align-items: center; flex-wrap: wrap; }
  details.item > summary::-webkit-details-marker { display: none; }
  details.item > summary::before { content: ''; width: 0; height: 0; border: 4px solid transparent;
                           border-left-color: var(--muted); flex: none; }
  details.item[open] > summary::before { border-left-color: transparent; border-top-color: var(--ink);
                           transform: translateY(2px); }
  details.item > summary .name { font-family: var(--mono); font-weight: 600; font-size: 13px; }
  details.item > summary .spacer { flex: 1; }
  details.item > .body { border-top: 1px solid var(--hair); padding: 4px 0 0 0; }
  details.item > .body > .schema { margin: 6px 14px 8px 32px; }
  details.item > .body > h4 { margin: 10px 14px 2px 32px; font: 600 10px/1 var(--mono);
                              text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
  details.item table { border-top: 1px solid var(--hair); }
  details.item table th { position: static; }
  /* dynamic-call trace */
  .site { padding: 10px 14px 14px 32px; border-top: 1px solid var(--hair); }
  .site .cands { margin: 4px 0 8px; }
  .site .cands .c { display: inline-block; margin: 2px 6px 2px 0; padding: 2px 8px;
                    border: 1px solid var(--det); color: var(--det); border-radius: 6px;
                    font-family: var(--mono); font-size: 12.5px; font-weight: 600; }
  .site .cands .c.foreign { border-style: dashed; color: var(--medium); border-color: var(--tan); }
  .trace { list-style: none; margin: 6px 0 0; padding: 0; font-size: 13px; }
  .trace li { padding: 3px 0 3px 14px; border-left: 2px solid var(--hair); margin-left: 6px; }
  .trace li .kind { color: var(--muted); font: 600 10px var(--mono); text-transform: uppercase;
                    letter-spacing: .1em; margin-right: 6px; }
  .trace li .src { color: var(--muted); font-size: 12px; margin-left: 8px; }
  .trace li.GEN, .trace li.EVR { background: var(--medium-bg); }
  .annotation { margin: 8px 0; padding: 8px 12px; border: 1px solid rgba(20, 108, 46, .25);
    border-radius: 8px; background: var(--det-bg); }
  .annotation > summary { cursor: pointer; font-weight: 600; }
  .annotation table { margin-top: 6px; background: none; }
  .traversal { margin: 6px 0 0; padding-left: 26px; font-size: 13px; }
  .traversal li { padding: 2px 0; }
  /* connections: schema basis */
  .legend { margin: 6px 0 10px; padding: 8px 12px; border: 1px solid var(--hair); border-radius: 8px;
    background: var(--card); font-size: 13px; line-height: 1.7; display: block; }
  .schema { margin: 4px 0 8px; padding: 6px 10px; border-left: 2px solid var(--line); font-size: 13px;
    line-height: 1.7; }
  .schema .mono { font-size: 12px; }
  /* business logic: the agent's key points, above everything the scanners found */
  .overview { background: var(--card); border: 1px solid var(--line); border-left: 2px solid var(--accent);
              border-radius: 0 10px 10px 0; padding: 14px 18px; margin: 20px 0 0; }
  .overview h3 { margin: 0 0 8px; font: 600 10px/1 var(--mono); text-transform: uppercase;
                 letter-spacing: .16em; color: var(--muted); display: flex; gap: 8px;
                 align-items: center; }
  .overview ul { margin: 0; padding-left: 18px; }
  .overview li { margin: 3px 0; }
  .overview .cite { color: var(--muted); font-size: 11.5px; margin-top: 8px; font-family: var(--mono); }
  .overview.empty-summary { color: var(--muted); border-left-color: var(--line); }
  .chain-summary { margin: 6px 0 10px; padding-left: 18px; font-size: 13px; }
  .chain-summary li { margin: 2px 0; }
  /* the same key points one level down: a program / job / PROC opens its own in a dialog */
  button.kplink { background: none; border: 0; padding: 0; margin-top: 2px; cursor: pointer;
                  font: inherit; font-size: 12px; color: var(--accent);
                  text-decoration: underline dotted; }
  button.kplink:hover { text-decoration: underline; }
  dialog#keypoints { border: 1px solid var(--line); border-radius: 12px; padding: 22px 26px;
                     max-width: 620px; color: var(--ink); background: var(--card); }
  dialog#keypoints::backdrop { background: rgba(15, 15, 15, .5); }
  dialog#keypoints h3 { margin: 0 0 8px; font-size: 15px; display: flex; gap: 8px;
                        align-items: center; }
  dialog#keypoints .lead { margin: 0 0 8px; color: var(--muted); }
  dialog#keypoints ul { margin: 0; padding-left: 18px; }
  dialog#keypoints li { margin: 4px 0; }
  dialog#keypoints .cite { color: var(--muted); font-size: 11.5px; margin-top: 10px;
                           font-family: var(--mono); }
  dialog#keypoints button.x { position: absolute; top: 10px; right: 14px; background: none;
                              border: 0; font-size: 20px; line-height: 1; cursor: pointer;
                              color: var(--muted); }
  /* batch chain */
  .chain-detail { margin-top: 14px; }
  .chain-detail .io { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 8px 0; }
  .chain-detail .io h4 { margin: 0 0 4px; font-size: 13px; }
  .chain-detail .io ul { margin: 0; padding-left: 18px; font-size: 12.5px; }

  /* flow diagrams - mftb/report/flow.py */
  .flow-box { background: var(--card); border: 1px solid var(--line); border-radius: 8px;
              padding: 16px 18px; margin-bottom: 14px; }
  .flow-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .flow-head .t { font-weight: 600; font-size: 15px; }
  .flow-head .s { color: var(--muted); }
  .flow-meta { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .flow-line { font-size: 12.5px; color: var(--muted); margin: 8px 0; display: flex;
               gap: 7px; align-items: baseline; }
  .flow-line .mono { color: var(--ink); }
  .flow-line .ico { color: var(--accent); font-weight: 700; flex: none; }
  .flow-line.back .ico { color: var(--medium); }
  .flow-levels { margin: 12px 0 4px; }
  .flow-conn { display: flex; align-items: center; gap: 8px; margin: 0 0 0 26px;
               min-height: 26px; }
  .flow-conn .stem { width: 2px; align-self: stretch; background: var(--line); flex: none; }
  .flow-conn .cap { color: var(--muted); font-size: 13px; margin-left: -10px; flex: none; }
  .flow-conn .lbl { font-size: 11.5px; color: var(--muted); border: 1px solid var(--line);
                    border-radius: 10px; padding: 1px 8px; background: var(--bg); }
  .flow-conn.proven .lbl { border-color: var(--det); color: var(--det); }
  .flow-conn.candidate .lbl, .flow-conn.derived .lbl { border-color: var(--gen); color: var(--gen); }
  .flow-conn.open .lbl { border-color: var(--high); color: var(--high); }
  .flow-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: stretch; }
  .flow-node { display: flex; flex-direction: column; justify-content: center; gap: 1px;
               min-width: 132px; max-width: 230px; padding: 7px 11px 7px 12px;
               border: 1px solid var(--line); border-left: 3px solid var(--accent);
               border-radius: 7px; background: var(--card); cursor: pointer; }
  .flow-node .n { font: 600 12.5px ui-monospace, Menlo, Consolas, monospace; }
  .flow-node .s { font-size: 11px; color: var(--muted); overflow: hidden;
                  text-overflow: ellipsis; white-space: nowrap; }
  .flow-node .bs { display: flex; gap: 4px; margin-top: 3px; flex-wrap: wrap; }
  .flow-node .bs span { font-size: 10px; border-radius: 8px; padding: 0 6px;
                        background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
  .flow-node.critical { border-left-color: var(--high); }
  .flow-node.critical .n { color: var(--high); }
  .flow-node.missing { border-left-color: var(--medium); border-style: dashed; }
  .flow-node.open { border-left-color: var(--high); border-style: dashed; }
  .flow-node.candidate { border-left-color: var(--gen); border-style: dashed; }
  .flow-node:hover { border-color: var(--accent); }
  .flow-node.sel { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(20,90,138,.14); }
  .flow-box.picking .flow-node:not(.sel) { opacity: .45; }
  .flow-par { align-self: center; font-size: 11px; color: var(--muted); }
  .flow-rowmeta { font-size: 11.5px; color: var(--muted); margin: 0 0 5px 28px; }
  .flow-rowmeta b { color: var(--ink); font-weight: 600; }
  .flow-more { width: 100%; }
  .flow-more > summary { cursor: pointer; font-size: 11.5px; color: var(--accent);
                         margin: 7px 0 0 2px; }
  .flow-more > .flow-row { margin-top: 8px; }
  .flow-legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px;
                 color: var(--muted); margin-top: 7px; }
  .flow-legend span { display: inline-flex; align-items: baseline; gap: 5px; }
  .flow-legend i { width: 10px; height: 10px; border: 1px solid var(--line);
                   border-left: 3px solid var(--accent); border-radius: 3px;
                   display: inline-block; }
  .flow-legend i.missing { border-left-color: var(--medium); border-style: dashed; }
  .flow-legend i.open { border-left-color: var(--high); border-style: dashed; }
  .flow-legend i.candidate { border-left-color: var(--gen); border-style: dashed; }
  .flow-legend i.critical { border-left-color: var(--high); }
  .flow-foot { font-size: 12.5px; color: var(--muted); margin-top: 12px;
               border-top: 1px solid var(--line); padding-top: 9px; }

  /* program-flow diagram */
  .flowwrap { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
              overflow: auto; max-height: 720px; }
  .flowwrap svg { display: block; }
  .flow .nlabel { font: 600 12px var(--mono); fill: var(--ink); }
  .flow .nsub { font: 10px var(--sans); fill: var(--muted); }
  .flow .nbox { fill: var(--card); stroke: var(--ink); stroke-width: 1.2; rx: 8; cursor: pointer; }
  .flow .nbox.step { fill: var(--info-bg); stroke: var(--accent); }
  .flow .nbox.boundary { fill: var(--medium-bg); stroke: var(--tan); stroke-dasharray: 4 3; }
  .flow .nbox.unresolved-target, .flow .nbox.absent-proc, .flow .nbox.absent-jcl,
  .flow .nbox.absent-include, .flow .nbox.unsupplied-module
    { fill: var(--high-bg); stroke: var(--high); stroke-width: 1.5; stroke-dasharray: 3 3; }
  .flow .nbox.job, .flow .nbox.schedule { fill: var(--info-bg); stroke: var(--accent); }
  .flow .nlabel.missing { fill: var(--high); }
  .flow .nbox.runtime-routine, .flow .nbox.utility, .flow .nbox.build-tool,
  .flow .nbox.launcher { stroke: var(--muted); fill: var(--flat-bg); }
  .flow g.sel .nbox { stroke-width: 2.5; }
  .flow .edge { fill: none; stroke: rgba(25, 25, 25, .35); stroke-width: 1.3; }
  .flow .edge.proven { stroke: var(--det); }
  .flow .edge.candidate { stroke: var(--tan); stroke-dasharray: 5 4; }
  .flow .edge.derived { stroke: var(--tan); stroke-dasharray: 8 3; }
  .flow .edge.open { stroke: var(--high); stroke-dasharray: 2 3; }
  .flow .edge.dim { opacity: .12; }
  .flow g.dim { opacity: .25; }
  .flowlegend { display: flex; gap: 14px; flex-wrap: wrap; font: 11px var(--mono); color: var(--muted);
                margin: 8px 0 12px; }
  .flowlegend span.k::before { content: '\2014'; margin-right: 5px; font-weight: 700; }
  .flowlegend span.proven::before { color: var(--det); }
  .flowlegend span.candidate::before { color: var(--tan); }
  .flowlegend span.open::before { color: var(--high); }
  .flowlegend span.missing::before { color: var(--high); }
  .nodedetail { margin-top: 10px; }
  .nodedetail table { border: 1px solid var(--line); border-radius: 10px; }
  /* inventory tabs + pagination */
  .tabs { display: flex; gap: 2px; flex-wrap: wrap; border-bottom: 1px solid var(--line);
          margin: 0 0 16px; }

    e.append(c.nodeType ? c : document.createTextNode(String(c)));

// ---- flow diagrams: one renderer for every levelled flow (see mftb/report/flow.py) -------
// The spec arrives levelled and ordered from mftb/analysis/flowgraph.py: this
// builds one HTML string, assigns it once, and listens for clicks on the box.
const FLOW_ESC = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

function flowLineHtml(l, cls) {
  return '<div class="flow-line ' + (cls || '') + '"' + (l.title ? ' title="' + FLOW_ESC(l.title) + '"' : '') +
    '><span class="ico">' + FLOW_ESC(l.icon || '\u00b7') + '</span><span>' + FLOW_ESC(l.text || '') +
    (l.mono ? ' <span class="mono">' + FLOW_ESC(l.mono) + '</span>' : '') +
    (l.note ? ' ' + FLOW_ESC(l.note) : '') + '</span></div>';
}

const FLOW_STATES = {ok: 'proven, in scan', missing: 'referenced, not in scan',
                     open: 'target named by a data item', critical: 'critical',
                     candidate: 'candidate target, not proven for this path'};
const FLOW_WIDE = 8;    // nodes on one level before the rest fold behind a summary

function flowNodeHtml(n, drop) {
  const badges = (n.badges || []).map(b => b.text || b)
    .filter(t => !(drop || []).includes(t))
    .map(t => '<span>' + FLOW_ESC(t) + '</span>').join('');
  const title = [n.title, ...(n.via || [])].filter(Boolean).join(' | ');
  return '<div class="flow-node ' + FLOW_ESC(n.state || 'ok') + '" data-id="' + FLOW_ESC(n.id) + '"' +
    (title ? ' title="' + FLOW_ESC(title) + '"' : '') + '>' +
    '<span class="n">' + FLOW_ESC(n.label || n.id) + '</span>' +
    (n.sub ? '<span class="s">' + FLOW_ESC(n.sub) + '</span>' : '') +
    (badges ? '<span class="bs">' + badges + '</span>' : '') + '</div>';
}

function flowHtml(spec) {
  const head = '<div class="flow-head"><span class="t">' + FLOW_ESC(spec.head.title) + '</span>' +
    (spec.head.sub ? '<span class="s">' + FLOW_ESC(spec.head.sub) + '</span>' : '') + '</div>' +
    (spec.meta && spec.meta.length
      ? '<div class="flow-meta">' + spec.meta.map(FLOW_ESC).join('  \u00b7  ') + '</div>' : '');
  const levels = (spec.levels || []).map((lv, i) => {
    const conn = i === 0 ? '' :
      '<div class="flow-conn ' + FLOW_ESC((lv.via && lv.via.certainty) || '') + '">' +
      '<span class="stem"></span><span class="cap">\u25be</span>' +
      (lv.via && lv.via.text ? '<span class="lbl">' + FLOW_ESC(lv.via.text) + '</span>' : '') + '</div>';
    const par = lv.parallel
      ? '<span class="flow-par" title="same depth: the store does not prove an order between these">' +
        'parallel</span>' : '';
    // a badge every node on the level carries distinguishes none of them: it is
    // said once for the level instead of repeated on each node
    const shared = lv.nodes.length > 2
      ? (lv.nodes[0].badges || []).map(b => b.text || b).filter(
          t => lv.nodes.every(n => (n.badges || []).some(b => (b.text || b) === t)))
      : [];
    const meta = lv.nodes.length > FLOW_WIDE || shared.length
      ? '<div class="flow-rowmeta"><b>' + lv.nodes.length + '</b> at this depth' +
        shared.map(t => '  \u00b7  all ' + FLOW_ESC(t)).join('') + '</div>' : '';
    const draw = n => flowNodeHtml(n, shared);
    const rest = lv.nodes.length > FLOW_WIDE
      ? '<details class="flow-more"><summary>show the other ' + (lv.nodes.length - FLOW_WIDE) +
        '</summary><div class="flow-row">' + lv.nodes.slice(FLOW_WIDE).map(draw).join('') +
        '</div></details>' : '';
    return conn + meta + '<div class="flow-row">' +
      lv.nodes.slice(0, FLOW_WIDE).map(draw).join('') + par + rest + '</div>';
  }).join('');
  const states = [...new Set((spec.levels || []).flatMap(lv => lv.nodes.map(n => n.state || 'ok')))];
  const legend = states.length > 1
    ? '<div class="flow-legend">' + states.filter(s => FLOW_STATES[s]).sort().map(
        s => '<span><i class="' + FLOW_ESC(s) + '"></i>' + FLOW_ESC(FLOW_STATES[s]) + '</span>')
      .join('') + '</div>' : '';
  const back = (spec.back || []).map(b => flowLineHtml(
    {icon: '\u21ba', text: b.text || (b.from + ' returns to ' + b.to), title: b.source}, 'back'));
  return head + legend +
    (spec.before || []).map(l => flowLineHtml(l, 'in')).join('') +
    '<div class="flow-levels">' + levels + '</div>' +
    (back.length > 4
      ? '<details class="flow-more"><summary>' + back.length +
        ' hop(s) back to a program already above</summary>' + back.join('') + '</details>'
      : back.join('')) +
    (spec.after || []).map(l => flowLineHtml(l, 'out')).join('') +
    (spec.footer && spec.footer.length
      ? '<div class="flow-foot">' + spec.footer.map(l => flowLineHtml(l)).join('') + '</div>' : '');
}

// -> the diagram as one element. `footer` holds nodes the caller builds (links
// into the tabs that own the detail), appended after the string is parsed.
function renderFlow(spec, footer) {
  const box = el('div', {class: 'flow-box', id: spec.id});
  for (const [k, v] of Object.entries(spec.facets || {})) box.setAttribute('data-' + k, v);
  box.innerHTML = flowHtml(spec);
  if (footer) {
    let foot = box.querySelector('.flow-foot');
    if (!foot) box.append(foot = el('div', {class: 'flow-foot'}));
    foot.append(...[].concat(footer));
  }
  box.addEventListener('click', ev => {
    const node = ev.target.closest('.flow-node');
    if (!node) return;
    const chosen = !node.classList.contains('sel');
    for (const n of box.querySelectorAll('.flow-node.sel')) n.classList.remove('sel');
    node.classList.toggle('sel', chosen);
    box.classList.toggle('picking', chosen);
  });
  return box;
}

// ---- dynamic calls: one row per site, ladder and resolution behind it --------------
const dynDiv = document.getElementById('dyncalls');
// the site's status as the page reports it: the scanner's, unless the
// resolution skill worked the site and said otherwise
const siteStatus = s => { const a = annotations[s.source]; return (a && a.status) || s.status; };
const DC_STATUS_RANK = {open: 0, partial: 1, resolved: 2};
const dcCount = st => sites.filter(s => siteStatus(s) === st).length;
const dcResolved = dcCount('resolved'), dcPartial = dcCount('partial'), dcOpen = dcCount('open');

}
// the ladder the tracer walked, as a list of cited hops
function dcLadder(s) {
  const ul = el('ul', {class: 'trace'});
  for (const t of s.trace) {
    ul.append(el('li', {class: t.class, style: 'margin-left:' + (6 + t.depth * 18) + 'px'},
      el('span', {class: 'kind'}, t.kind), badge(t.class, t.class), ' ',
      t.program !== s.program ? el('b', {}, t.program + ': ') : null,
      t.detail, el('span', {class: 'src mono'}, t.source)));
  }
  return ul;
}
// the skill's own account of the site: derived targets, the path it walked, what it left open
function dcAnnotation(a) {
  const ann = el('div', {class: 'annotation'});
  ann.append(el('h4', {}, 'Resolution \u2014 dynamic-call-resolution skill ', badge(a.status, a.status),
    badge('agent judgment', 'agent'),
    a.summary ? el('span', {class: 'muted'}, ' ' + a.summary) : null));
  if ((a.targets || []).length) {
    ann.append(table(['Target', 'Basis', 'Reasoning', 'Evidence'], a.targets.map(t =>
      el('tr', {}, el('td', {class: 'mono'}, t.name + (t.in_inventory ? '' : ' ?')),
        el('td', {}, badge(t.basis, t.basis)), el('td', {}, t.reasoning || ''),
        el('td', {class: 'mono'}, (t.evidence || []).join('\n'))))));
  }
  if ((a.traversal || []).length) {
    ann.append(el('ol', {class: 'traversal'}, ...a.traversal.map(x => el('li', {}, x))));
  }
  for (const c of a.closed_by_reasoning || []) {
    ann.append(el('div', {class: 'closure'}, badge('skill', 'skill'), ' ',
      (c.kinds || []).join(', ') + ': ' + (c.reasoning || ''),
      el('div', {class: 'mono muted'}, (c.evidence || []).join('\n')),
      c.residual ? el('div', {class: 'muted'}, 'residual: ' + c.residual) : null));
  }
  return ann;
}
// what is still needed, with who can supply it: the tracer's own open ends and
// the skill's remaining asks, each verbatim. A tracer open end the skill closed
// by cited reasoning is not outstanding - the closure is shown in the
// resolution instead, exactly as findings.py counts it closed.
function dcClosedKinds(a) {
  const closed = new Set((a && a.closed_by_reasoning || []).flatMap(c => c.kinds || []));
  for (const oe of (a && a.open_ends) || []) closed.delete(oe.kind);
  return closed;
}
const dcAsks = s => {
  const a = annotations[s.source], closed = dcClosedKinds(a);
  return [...(s.open_ends || []).filter(oe => !closed.has(oe.kind))
            .map(oe => ({cls: oe.class, text: oe.request, src: oe.source})),
          ...((a && a.open_ends) || [])
            .map(oe => ({cls: oe.class || 'EVR', text: oe.request, src: oe.note || ''}))];
};
const DC_COLUMNS = ['', 'Site', 'Construct', 'Operand', 'Status', 'Reaches (scanner)',
                    'Resolution (agent)', 'Needs'];
const dcRows = [...sites].sort((a, b) =>
  DC_STATUS_RANK[siteStatus(a)] - DC_STATUS_RANK[siteStatus(b)] || a.source.localeCompare(b.source));
dynDiv.append(table(DC_COLUMNS, dcRows.flatMap(s => {
  const a = annotations[s.source];
  const st = siteStatus(s);
  const asks = dcAsks(s);
  const detail = dcAnchor(s.source) + '-d';
  const row = el('tr', {class: 'dcrow', id: dcAnchor(s.source), 'data-detail': detail,
                        'data-status': st, 'data-program': s.program, 'data-construct': s.construct,
                        'data-resolution': a ? 'worked by the skill' : 'scanner only',
                        'data-needs': asks.length ? 'artifact needed' : 'nothing outstanding'},
    caretCell('show the ladder and the resolution for this site'),
    el('td', {class: 'mono'}, s.source),
    el('td', {class: 'mono'}, s.construct),
    el('td', {class: 'mono'}, s.variable),
    el('td', {}, badge(st, st)),
    el('td', {class: 'mono'}, ...(s.candidates.length
      ? s.candidates.flatMap((c, i) => [i ? ', ' : null,
          el('span', {class: 'c' + (c.in_inventory ? '' : ' foreign'),
                      title: c.evidence.map(e => e.how + ' @ ' + e.source).join('\n')},
            c.name + (c.in_inventory ? '' : ' ?'))])
      : [el('span', {class: 'muted'}, '\u2014 no name the ladder can prove')])),
    el('td', {}, ...(a && (a.targets || []).length
      ? a.targets.flatMap((t, i) => [i ? ' ' : null,
          el('span', {class: 'mono'}, t.name + (t.in_inventory ? '' : ' ?')), ' ',
          badge(t.basis, t.basis)])
      : [el('span', {class: 'muted'}, a ? '\u2014 worked, no target derivable'
                                        : '\u2014 not worked by the skill yet')])),
    el('td', {}, asks.length
      ? el('span', {}, badge(asks[0].cls, asks[0].cls), ' ', asks[0].text,

      : el('span', {class: 'muted'}, st === 'resolved' ? '\u2014' : 'nothing asked for yet')));
  const body = el('div', {class: 'site'});
  if (asks.length) {
    for (const ask of asks) {
      body.append(el('div', {class: 'request'}, badge(ask.cls, ask.cls), ' needs this artifact: ',
        ask.text, ask.src ? el('span', {class: 'src mono muted'}, '  ' + ask.src) : null));
    }
  }
  if (a) body.append(dcAnnotation(a));
  body.append(el('h4', {}, 'Ladder \u2014 how the value is set, hop by hop ', badge('scanner', 'det')),
              dcLadder(s));
  return [row, el('tr', {class: 'detail', id: detail, hidden: ''},
    el('td', {colspan: DC_COLUMNS.length}, body))];
})));

// ---- connections: one tab per boundary category, each filterable + paginated ------------
// The tabs are the categories of boundary.json (data, online, interface, code,
// schedule), so what the detectors found sits under the same heading as what the
// boundary says has to be established; the product is the section within a tab.
const connBoxes = Object.fromEntries(['boundary', 'dbms', 'imsidms', 'db2', 'datasets', 'cics',
                                      'interfaces', 'external', 'runtime', 'schedconn']
  .map(k => [k, document.getElementById(k)]));
const connCounts = {};
const addCount = (tab, n) => { connCounts[tab] = (connCounts[tab] || 0) + n; };
if (!conn) {
  for (const b of Object.values(connBoxes)) b.append(el('div', {class: 'empty'},
    'No connections.json in the store (run `mftb scan` or `mftb scan-connections`).'));
} else {
  document.getElementById('conn-intro').textContent =
    'Every place the scanned source touches something outside itself, with the line it rests on. ' +
    'Boundary is the derived cut-line; the other tabs are the evidence behind it.';
  const mono = (t, cls) => el('td', {class: 'mono ' + (cls || '')}, t);
  const lines = arr => (arr || []).join('\n');
  const row = (facets, ...cells) => el('tr', facets, ...cells);
  const opsText = ops => Object.entries(ops || {}).map(([k, v]) => k + (v > 1 ? '×' + v : '')).join(' ');
  const CAT = 'data-cat';
  const bindOpts = b => [b.owner && 'OWNER ' + b.owner, b.qualifier && 'QUALIFIER ' + b.qualifier,
    b.isolation && 'ISOLATION ' + b.isolation, b.release && 'RELEASE ' + b.release,
    b.currentdata && 'CURRENTDATA ' + b.currentdata].filter(Boolean).join(' · ');

  // -- boundary: one row per connection to establish -------------------------------------
  const bnd = DATA.boundary;
  const CAT_TITLE = {data: 'Data', online: 'Online / region', interface: 'Interfaces',
                     code: 'Code', schedule: 'Schedule'};
  const DIRECTION = {in: '◄ in', out: '► out', both: '◄► both'};
  const STATUS_CLS = {'must-establish': 'medium', 'satisfied-in-drop': 'det', unknown: 'high'};
  const LEVEL_HINT = {unknown: 'no name: what it reaches is unresolved',
                      estate: 'named, no owning module in the store',
                      module: 'owned by another scanned module',
                      internal: 'produced and consumed inside this module'};
  if (!bnd) {
    connBoxes.boundary.append(el('div', {class: 'empty'}, SCOPE
      ? 'The boundary is a module-level view: see it in the module report, not in this chain cut.'
      : 'No boundary.json in the store (run `mftb scan`).'));
  } else {
    const bDiv = el('div', {});
    for (const cat of ['data', 'online', 'interface', 'code', 'schedule']) {
      const rows = bnd.connections.filter(c => c.category === cat);
      const slots = bnd.slots.filter(s => s.category === cat);
      const missing = slots.filter(s => !s.detector).map(s => s.provider);
      bDiv.append(group(CAT_TITLE[cat], [badge(rows.length + ' connection(s)', rows.length ? 'medium' : 'det'),
          missing.length ? el('span', {class: 'muted'}, 'no detector for: ' + missing.join(', ')) : null],
        el('div', {},
          table(['Provider', 'Counterpart', 'Resolved to', 'Direction', 'Status', 'What it means', 'Evidence'],
            rows.map(c => row({[CAT]: cat, 'data-provider': c.provider, 'data-status': c.status,
                               'data-direction': c.direction, 'data-level': c.counterpart.level,
                               'data-name': c.counterpart.name || ''},
              mono(c.provider), mono(c.counterpart.name || '(unnamed)'),
              el('td', {}, badge(c.counterpart.level, c.counterpart.level === 'module' ? 'det' : 'info'),
                 el('span', {class: 'muted'}, ' ' + (c.counterpart.module ||
                    LEVEL_HINT[c.counterpart.level]))),
              el('td', {}, DIRECTION[c.direction]),
              el('td', {}, badge(c.status, STATUS_CLS[c.status])),
              el('td', {class: 'muted'}, c.detail),
              mono(lines(c.evidence), 'muted')))),
          missing.length ? el('div', {class: 'request'},
            'Declared but not detected here: ' + missing.join(', ') +
            ' — an empty slot, not a clean bill (see the domain DETECTORS.md scope).') : null),
        'sub', rows.length > 0));
    }
    const s = bnd.summary;
    const cats = Object.keys(s.by_category).length;
    intro('boundary-intro', [badge(s.connections + ' connection(s)', 'medium'),
        badge(cats + ' of 5 categories', 'info'),
        badge((s.by_status['must-establish'] || 0) + ' to establish', 'medium'),
        badge((s.by_status['unknown'] || 0) + ' unknown', (s.by_status['unknown'] || 0) ? 'high' : 'det'),
        s.counterpart_modules.length ? badge(s.counterpart_modules.length + ' counterpart module(s): ' +
          s.counterpart_modules.join(', '), 'det') : null],
      'What has to exist on the other side for this module to run' +
      (s.estate_modules.length ? '. Scanned so far: ' + s.estate_modules.join(', ') +

            [['name', 'counterpart']]);

    // Each category tab says which of its providers the toolbox has no detector

  // -- database systems: presence per product, absence stated ---------------------------
  const dbms = conn.dbms && conn.dbms.db2 && conn.dbms.ims && conn.dbms.idms ? conn.dbms : null;
  if (dbms) {
    const dbRow = (name, d, detail) => [
      el('div', {class: 'k'}, name),
      el('div', {}, badge(d.present ? 'found' : 'not found', d.present ? 'present' : 'absent'), ' ', d.statement,
        d.looked_for && d.present ? el('div', {class: 'note'}, 'looked for: ' + d.looked_for) : null,
        detail ? el('div', {class: 'mono muted'}, detail) : null)];
    const evid = d => lines(d.programs.map(p => p.program + ': ' + p.evidence.map(e => e.detail + ' @ ' + e.source).join('; ')));
    const rows = [...dbRow('DB2', dbms.db2, dbms.db2.programs.join(' ')),
                  ...dbRow('IMS DB (DL/I)', dbms.ims, evid(dbms.ims)),
                  ...dbRow('IDMS', dbms.idms, evid(dbms.idms))];
    for (const o of dbms.other_exec_dialects) {
