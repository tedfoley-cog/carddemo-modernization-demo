                el('div', {}, badge('unknown dialect', 'high'), ' ', o.programs.join(' '), el('div', {class: 'mono muted'}, lines(o.sources))));
    }
    if (!dbms.other_exec_dialects.length) rows.push(el('div', {class: 'k'}, 'Other'), el('div', {class: 'muted'}, 'no other EXEC dialect (SQL / CICS / DLI / IDMS are the known ones)'));
    intro('dbms-intro', [
        badge('DB2 ' + (dbms.db2.present ? dbms.db2.programs.length + ' pgm' : 'none'), dbms.db2.present ? 'det' : 'absent'),
        badge('IMS DB ' + (dbms.ims.present ? dbms.ims.programs.length + ' pgm' : 'none found'), dbms.ims.present ? 'medium' : 'absent'),
        badge('IDMS ' + (dbms.idms.present ? dbms.idms.programs.length + ' pgm' : 'none found'), dbms.idms.present ? 'medium' : 'absent')],
      '"None found" is a scanned absence, not an unknown.');
    connBoxes.dbms.append(el('div', {class: 'dbms'}, ...rows));
    addCount('Data', [dbms.db2, dbms.ims, dbms.idms].filter(d => d.present).length + dbms.other_exec_dialects.length);
  } else {
    connBoxes.dbms.append(el('div', {class: 'empty'}, 'connections.json predates DBMS presence detection; re-run the scan.'));
  }

  // -- IMS DB (DL/I) and IDMS: the connection, not the data behind it -------------------
  const ims = conn.ims, idms = conn.idms;
  if (!ims || !idms) {
    connBoxes.imsidms.append(el('div', {class: 'empty'},
      'connections.json predates the IMS / IDMS inventory; re-run `mftb scan-connections`.'));
  } else {
    const iDiv = el('div', {});
    const cite = s => mono(s || '', 'muted');
    iDiv.append(group('IMS DB (DL/I) — programs', [badge(ims.present ? ims.programs.length + ' pgm' : 'none found', ims.present ? 'medium' : 'absent'),
        el('span', {class: 'muted'}, ims.statement)],
      ims.programs.length ? table(['Program', 'Interface', 'DL/I calls (function · PCB)', 'EXEC DLI', 'PCBs', 'PSBs'],
        ims.programs.map(p => row({[CAT]: 'ims', 'data-program': p.program, 'data-name': 'IMS', 'data-status': 'ims'},
          mono(p.program), mono(p.interfaces.join(' ')),
          mono(lines(p.calls.map(c => (c.function || c.function_operand || '?') + ' · ' + (c.pcb || '?') + ' @ ' + c.source)), 'muted'),
          mono(lines(p.commands.map(c => c.detail + ' @ ' + c.source)), 'muted'),
          mono(lines(p.pcbs.map(x => x.name + ' (' + x.basis + ')')), 'muted'),
          mono(lines(p.psbs.map(x => x.name)), 'muted'))))
        : el('div', {class: 'empty'}, 'No EXEC DLI and no CALL to a DL/I language interface in the scanned programs — an absence, not an unknown.'),
      'sub', ims.present));
    iDiv.append(group('IMS regions (EXEC PGM=DFSRRC00)', [badge(ims.regions.length, 'info')],
      ims.regions.length ? table(['Job.step', 'Controller', 'Region', 'Runs', 'PSB', 'PARM', 'Source'],
        ims.regions.map(r => row({[CAT]: 'ims', 'data-program': r.program || '', 'data-name': 'region', 'data-status': r.psb ? 'ims' : 'psb-unknown'},
          mono(r.job + '.' + r.step), mono(r.controller),
          el('td', {}, r.region_type || '?', el('div', {class: 'muted'}, r.region_type_detail || '')),
          mono(r.program || '?'), el('td', {}, r.psb ? mono(r.psb) : badge('unknown — ask', 'high')),
          mono(r.parm || '', 'muted'), cite(r.source))))
        : el('div', {class: 'empty'}, 'No IMS region controller step in the scanned JCL.'), 'sub', false));
    iDiv.append(group('IMS DDs', [badge(ims.dds.length, 'info')],
      table(['Job.step', 'DD', 'Role', 'DSN', 'Source'], ims.dds.map(d => row({[CAT]: 'ims', 'data-program': d.dd, 'data-name': d.dd, 'data-status': 'dd'},
        mono(d.job + '.' + d.step), mono(d.dd), el('td', {}, d.role), mono(lines(d.dsns || []), 'muted'), cite(d.source)))), 'sub', false));
    iDiv.append(group('IDMS — programs', [badge(idms.present ? idms.programs.length + ' pgm' : 'none found', idms.present ? 'medium' : 'absent'),
        idms.run_mode ? badge(idms.run_mode, 'det') : badge('run mode unproven', 'medium'), el('span', {class: 'muted'}, idms.statement)],
      idms.programs.length ? table(['Member', 'Kind', 'Mode', 'Subschema / schema', 'DML', 'READY areas', 'CALL / COPY'],
        idms.programs.map(p => row({[CAT]: 'idms', 'data-program': p.program, 'data-name': 'IDMS', 'data-status': p.subschema ? 'idms' : 'subschema-unknown'},
          mono(p.program), el('td', {}, badge(p.kind || 'program', p.kind === 'copybook' ? 'info' : 'det')),
          el('td', {}, p.mode ? p.mode.mode : el('span', {class: 'muted'}, 'no PROTOCOL statement')),
          el('td', {}, (p.subschemas || (p.subschema ? [p.subschema] : [])).length
            ? mono(lines((p.subschemas || [p.subschema]).map(s => s.name + ' WITHIN ' + s.schema)))
            : badge('unknown — ask', 'high')),
          mono(lines(p.commands.map(c => c.detail + ' @ ' + c.source)), 'muted'),
          mono(lines(p.ready_areas.map(a => a.area)), 'muted'),
          mono(lines([...p.calls.map(c => "CALL '" + c.routine + "' @ " + c.source),
                      ...p.copies.map(c => 'COPY IDMS ' + c.directive + ' @ ' + c.source)]), 'muted'))))
        : el('div', {class: 'empty'}, 'No EXEC IDMS, COPY IDMS or CALL to an IDMS interface in the scanned programs — an absence, not an unknown.'),
      'sub', idms.present));
    iDiv.append(group('IDMS runtime evidence in the JCL', [badge(idms.dds.length + ' DD(s)', 'info'), badge(idms.utilities.length + ' utility step(s)', 'info'),
        badge(idms.parameters.length + ' SYSIDMS parameter(s)', 'info')],
      el('div', {},
        table(['Job.step', 'DD', 'Role', 'DSN', 'Source'], idms.dds.map(d => row({[CAT]: 'idms', 'data-program': d.dd, 'data-name': d.dd, 'data-status': 'dd'},
          mono(d.job + '.' + d.step), mono(d.dd), el('td', {}, d.role), mono(lines(d.dsns || []), 'muted'), cite(d.source)))),
        table(['Job.step', 'Utility', 'Role', 'Source'], idms.utilities.map(u => row({[CAT]: 'idms', 'data-program': u.program, 'data-name': u.program, 'data-status': 'utility'},
          mono(u.job + '.' + u.step), mono(u.program), el('td', {}, u.role), cite(u.source)))),
        table(['Job.step', 'Keyword', 'Value', 'Source'], idms.parameters.map(p => row({[CAT]: 'idms', 'data-program': p.keyword, 'data-name': p.keyword, 'data-status': 'parm'},
          mono(p.job + '.' + p.step), mono(p.keyword), mono(p.value), cite(p.source))))), 'sub', false));
    intro('imsidms-intro', [badge('IMS ' + (ims.present ? ims.programs.length + ' pgm' : 'none found'), ims.present ? 'medium' : 'absent'),
        badge(ims.regions.length + ' region step(s)', 'info'),
        badge('IDMS ' + (idms.present ? idms.programs.length + ' pgm' : 'none found'), idms.present ? 'medium' : 'absent'),
        badge(idms.run_mode || 'run mode unproven', idms.run_mode ? 'det' : 'medium')],
      'Interface, PSB or subschema, and the JCL that proves the region or run mode. What sits behind it is an ask.');
    connBoxes.imsidms.append(iDiv);
    toolbar('t-imsidms', 'imsidms', [['cat', 'products'], ['program', 'programs / names'], ['status', 'statuses']], 'tbody tr', PAGE);
    addCount('Data', ims.programs.length + ims.regions.length + idms.programs.length + idms.utilities.length);
  }

  // -- DB2 ------------------------------------------------------------------------
  const db2 = conn.db2;
  const db2Div = el('div', {});
  const stByTable = new Map();
  for (const s of db2.statements) for (const tn of s.tables) {
    if (!stByTable.has(tn)) stByTable.set(tn, []);
    stByTable.get(tn).push(s);
  }
  const BASIS = {ddl: 'det', dclgen: 'det', copybook: 'gen', program: 'gen', linkage: 'gen', 'sql-only': 'high', none: 'medium', undefined: 'high'};
  // Table badge: what defines the table (DDL wins over DCLGEN when both exist).
  // Program badge: where that program's host variables are declared.
  const TABLE_BASIS_TEXT = {
    ddl: 'CREATE TABLE / VIEW scanned — the schema of record. Every DCLGEN and host variable is checked against it.',
    dclgen: 'no DDL scanned; the DECLARE TABLE (DCLGEN) in the program is the best available description — it is what the precompiler saw, current as of when it was generated.',
    'sql-only': 'only named in SQL statements: no DDL, no DECLARE TABLE — its columns are unknown to this scan.'};
  const PROGRAM_BASIS_TEXT = {
    dclgen: 'host variables come from the DCLGEN-generated 01 level, so the precompiler checked them against the table (as it was then).',
    copybook: 'host variables come from an ordinary copybook — a hand-written layout; checked here against the table basis above.',
    program: 'host variables are declared in the program’s own WORKING-STORAGE — hand-written; checked here against the table basis above.',
    linkage: 'host variables live in LINKAGE — the caller owns the layout.',
    none: 'no host variable is paired with a column (COUNT(*), literals).',
    undefined: 'a host variable used in SQL is not defined in the scanned source (missing copybook?).'};
  db2Div.append(el('div', {class: 'legend'},
    el('div', {}, el('b', {}, 'Schema basis')),
    el('div', {}, 'Table badge — what defines the table, in order of precedence (the first one found is used; the rest are compared against it):'),
    ...Object.entries(TABLE_BASIS_TEXT).map(([k, v]) => el('div', {}, badge(k, BASIS[k]), ' ', v)),
    el('div', {}, 'Program badge — where that program’s host variables are declared:'),
    ...Object.entries(PROGRAM_BASIS_TEXT).map(([k, v]) => el('div', {}, badge(k, BASIS[k]), ' ', v)),
    el('div', {class: 'muted'}, 'When a table has both DDL and DCLGEN, the DDL is the schema and the DCLGEN is compared to it: ' +
      '"agrees" or "DISAGREES" is stated on the table, and a disagreement is a finding (db2-dclgen-ddl-mismatch) — never reconciled silently.')));
  const originText = p => (p.host_origins || []).map(o => o.kind + (o.name ? ' ' + o.name : '') + ' :' + o.hosts.slice(0, 4).join(' :') +
      (o.hosts.length > 4 ? ' …' : '') + (o.source ? ' @ ' + o.source : '')).join('\n');
  const checksText = c => c ? (c.ok + ' ok' + (c.mismatch ? ', ' + c.mismatch + ' mismatch' : '') + (c.unchecked ? ', ' + c.unchecked + ' unchecked' : '')) : '';
  // one item per table: everything known about it (schema basis, DCLGENs, the
  // programs and statements that touch it) sits inside; the toolbar pages tables
  const db2Items = el('div', {class: 'items'});
  for (const t of db2.tables) {
    const sts = (stByTable.get(t.name) || []);
    const sc = t.schema || {basis: t.ddl.length ? 'ddl' : 'sql-only', ddl: t.ddl, dclgen: [], program_basis: {}, type_checks: null, mismatches: []};
    const pb = sc.program_basis || {};
    const detail = el('div', {class: 'schema'},
      el('div', {}, badge(sc.basis, BASIS[sc.basis]), ' ',
        sc.ddl.length ? 'schema of record: DDL ' + sc.ddl.join(', ') + (t.ddl_match ? ' (' + t.ddl_match + ')' : '') +
            (sc.dclgen.length ? ' — DDL takes precedence; the ' + sc.dclgen.length + ' DCLGEN below ' + (sc.dclgen.length === 1 ? 'is' : 'are') + ' compared against it' : '')
          : sc.dclgen.length ? 'no CREATE TABLE/VIEW/ALIAS scanned — the DCLGEN below is the only description of the table (what the precompiler saw, not the live catalog)'
          : 'no CREATE TABLE/VIEW/ALIAS and no DECLARE TABLE scanned for this table'),
      ...sc.dclgen.map(d => el('div', {}, badge('dclgen', 'det'), ' ', d.program + ': DECLARE TABLE ' + (d.member ? 'in INCLUDE ' + d.member : 'inline') +
        ', ' + d.columns + ' column(s) @ ' + d.source + (d.host_structure ? '; host structure ' + d.host_structure + ' @ ' + d.host_structure_source : '; no generated host structure') +
        (sc.ddl.length ? (d.agrees_with_ddl ? ' — agrees with the DDL' : ' — DISAGREES with the DDL: ' + d.differences.slice(0, 6).join('; ') + (d.differences.length > 6 ? ' …' : '')) : ' — no DDL to compare against'),
        d.agrees_with_ddl === false ? badge('mismatch', 'high') : null)),
      el('div', {class: 'muted'}, 'programs by host-layout basis: ' + Object.entries(pb).filter(([, v]) => v).map(([k, v]) => k + ' ' + v).join(', ') +
        (sc.type_checks ? ' · host-variable type checks: ' + checksText(sc.type_checks) : '') +
        (t.seed_rows != null ? ' · ' + t.seed_rows + ' seed rows scanned (a snapshot, not the live table)' : '')),
      ...(sc.mismatches || []).slice(0, 12).map(m => el('div', {class: 'mono'}, badge('type', 'high'), ' ', m.program + ': ' + m.column + ' ' + m.type +
        ' (' + m.type_from + ') vs :' + m.host + ' ' + m.host_def + ' @ ' + m.host_source + ' — ' + m.detail + ' [' + m.role + ' @ ' + m.source + ']')),
      (sc.mismatches || []).length > 12 ? el('div', {class: 'muted'}, (sc.mismatches.length - 12) + ' more in connections.json') : null);
    const progTable = table(['Program', 'Basis', 'Operations', 'Host variables come from', 'Statements (verb, cursor, columns, host variables, joins, predicate)', 'Source'],
      t.programs.map(p => row({'data-program': p.program},
        mono(p.program),
        el('td', {}, badge(p.basis || (t.ddl.length ? 'ddl' : 'sql-only'), BASIS[p.basis || (t.ddl.length ? 'ddl' : 'sql-only')]),
          p.type_checks && p.type_checks.mismatch ? badge(p.type_checks.mismatch + ' type', 'high') : null),
        mono(opsText(p.ops)),
        el('td', {class: 'mono muted'}, originText(p)),
        el('td', {class: 'mono muted'}, lines(sts.filter(s => s.program === p.program).map(s =>
          s.verb + (s.cursor ? ' ' + s.cursor : '') + (s.dynamic ? ' [DYNAMIC]' : '') +
          (s.columns && s.columns.length ? ' [' + s.columns.slice(0, 8).join(', ') + (s.columns.length > 8 ? ', …' : '') + ']' : '') +
          (s.host_vars.length ? ' :' + s.host_vars.slice(0, 6).join(' :') + (s.host_vars.length > 6 ? ' …' : '') : '') +
          ((s.joins || []).length ? ' JOIN ' + s.joins.map(j => j.table + ' ON ' + j.on).join('; ')
            : s.tables.length > 1 ? ' (with ' + s.tables.slice(1).join(', ') + ')' : '') +
          (s.where ? ' WHERE ' + s.where : '') + ' @ ' + s.source))),
        mono(lines(p.sources), 'muted'))));
    db2Items.append(item(anchorId('db2', t.name), t.name, [
        badge('table', 'info'),
        badge(t.reads + ' read', 'info'), badge(t.writes + ' write', t.writes ? 'medium' : 'info'),
        badge(sc.basis === 'ddl' ? 'DDL ' + t.columns + ' cols' : sc.basis, BASIS[sc.basis]),
        sc.dclgen.length ? badge('DCLGEN ' + sc.dclgen.length, sc.dclgen.every(d => d.agrees_with_ddl !== false) ? 'det' : 'high') : null,
        pb.copybook ? badge('copybook ' + pb.copybook, 'gen') : null,
        pb.program ? badge('program-local ' + pb.program, 'gen') : null,
        sc.type_checks && sc.type_checks.mismatch ? badge(sc.type_checks.mismatch + ' type mismatch', 'high') : null,
        el('span', {class: 'spacer'}),
        el('span', {class: 'muted'}, t.programs.length + ' program(s): ' + t.programs.map(p => p.program).join(' '))],
      {'data-kind': 'table', 'data-name': t.name, 'data-status': sc.basis,
       'data-writes': t.writes ? 'written' : 'read only'},
      [detail, el('h4', {}, 'Programs touching this table'), progTable], false));
  }
  // plans / packages and dynamic SQL are DB2 touch points of their own: items too,
  // so a filter on kind separates them from tables
  const bindItem = (kind, name, member, b) => item(anchorId('db2', kind + '.' + name + (member ? '.' + member : '')),
    kind + ' ' + name + (member ? '.' + member : ''), [
      badge(kind.toLowerCase(), 'info'), el('span', {class: 'mono muted'}, b.job + '.' + b.step),
      (b.pklist || []).length ? el('span', {class: 'muted'}, 'PKLIST ' + b.pklist.join(' ')) : null],
    {'data-kind': kind.toLowerCase(), 'data-name': name, 'data-status': 'bind'},
    [el('div', {class: 'schema'}, el('div', {}, el('b', {}, 'BIND options: '), bindOpts(b) || el('span', {class: 'muted'}, 'none stated')),
       el('div', {class: 'mono muted'}, '@ ' + b.source))], false);
  for (const p of db2.plans) db2Items.append(bindItem(p.kind, p.name, p.member, p));
  for (const b of db2.binds.filter(b => b.kind === 'PACKAGE')) db2Items.append(bindItem('PACKAGE', b.name, b.member, b));
  const dyn = db2.statements.filter(s => s.dynamic || s.procedure || s.kind === 'unparsed');
  for (const s of dyn) db2Items.append(item(anchorId('db2', 'dyn.' + s.source), s.program + ': ' + s.verb, [
      badge(s.procedure ? 'stored procedure' : s.dynamic ? 'dynamic SQL' : 'unparsed', 'medium'),
      el('span', {class: 'muted'}, s.procedure ? 'CALL ' + s.procedure : s.dynamic ? 'PREPARE/EXECUTE from a host variable — the statement text is decided at run time' : s.kind)],
    {'data-kind': s.procedure ? 'stored procedure' : s.dynamic ? 'dynamic SQL' : 'unparsed', 'data-name': s.procedure || s.program,
     'data-status': s.kind},
    [el('div', {class: 'schema'}, el('div', {class: 'mono muted'}, '@ ' + s.source))], false));
  db2Div.append(db2Items);
  const nPkg = db2.binds.filter(b => b.kind === 'PACKAGE').length;
  intro('db2-intro', [badge(db2.tables.length + ' tables', 'det'), badge(db2.statements.length + ' EXEC SQL', 'info'),
      badge(db2.subsystems.map(s => s.id).join(', ') || 'no DSN SYSTEM()', db2.subsystems.length ? 'det' : 'medium'),
      badge(db2.plans.length + ' plan(s), ' + nPkg + ' package bind(s)', 'info'), dyn.length ? badge(dyn.length + ' dynamic / procedure / unparsed', 'medium') : null],
    'One item per table: its schema basis, then every program that touches it. Plans, packages and dynamic SQL are their own kinds.');
  connBoxes.db2.append(db2Div);
  toolbar('t-db2', 'db2', [['kind', 'kinds'], ['status', 'schema bases'], ['writes', 'read / written']], 'details.item', PAGE,
          [['name', 'name'], ['kind', 'kind'], ['status', 'schema basis']]);
  addCount('Data', db2.tables.length);

  // -- datasets: one item per DSN, the COBOL files that bind to it listed inside -------------
  const dsType = d => (d.type || 'unknown').split(' ')[0];
  const TYPE_BASIS = {'idcams-define': 'det', 'dd-recorg': 'det', 'cobol-organization': 'gen', 'cobol-assign-as': 'gen', 'cics-file': 'gen',
                      'dd-amp': 'gen', 'dd-dcb': 'gen', 'no-catalog-evidence': 'medium', 'dsn-member': 'info', 'dsn-generation': 'info',
                      'dsn-temporary': 'info', 'referenced-only': 'medium'};
  const BIND_RANK = {missing: 0, unresolved: 1, unbound: 2, partial: 3, 'online-only': 4, 'sort-work': 5, bound: 6};
  const ORG = {INDEXED: 'VSAM KSDS', RELATIVE: 'VSAM RRDS', SEQUENTIAL: 'sequential', LINE_SEQUENTIAL: 'line sequential'};
  const okBind = f => ['bound', 'sort-work', 'online-only'].includes(f.binding_status);
  const isDsn = b => b.kind === 'dataset';
  const fileBy = new Map(conn.files.map(f => [f.program + '|' + f.dd, f]));
  const keyOf = f => [f.record_key, ...(f.alternate_keys || []).map(k => 'ALT ' + k.key + (k.duplicates ? ' (DUPS)' : '')), f.relative_key && 'REL ' + f.relative_key].filter(Boolean).join(' ');
  const bindText = b => b.job + '.' + b.step + (b.via && b.via.length ? ' (via ' + b.via.join('→') + (b.dynamic_site ? ' ⇢ dynamic call @ ' + b.dynamic_site : '') + ')' : '') +
    ' → ' + (b.kind === 'dataset' || b.kind === 'temporary' ? (b.dsn || '') + (b.disp ? ', ' + b.disp : '') +
       (b.concat && b.concat.length ? ' +' + b.concat.length + ' concat' : '') : b.kind === 'missing' ? 'DD ' + b.dd + ' NOT ALLOCATED in this step' : b.kind.toUpperCase());
  const FILE_COLS = ['Program', 'SELECT', 'DD', 'Organization / access', 'Key', 'Opened', 'Operations', 'Bound by (job.step → DSN, DISP)', 'Source'];
  const fileRow = (f, bindings, extra) => row({'data-program': f.program},
    mono(f.program), mono(f.file), mono(f.dd),
    el('td', {}, (ORG[f.organization] || f.organization) + (f.organization_stated ? '' : ' (default)') + ' / ' + (f.access || 'SEQUENTIAL')),
    mono(keyOf(f)),
    mono(f.open_modes.join(' ') || (f.sort_work ? 'SORT/MERGE' : '')),
    mono(opsText(f.ops)),
    el('td', {class: 'mono'}, lines(bindings.map(bindText)), extra || null),
    mono(f.source, 'muted'));
  const dsItems = el('div', {class: 'items'});
  for (const d of [...conn.datasets].sort((a, b) => a.dsn.localeCompare(b.dsn))) {
    // the COBOL files behind d.programs: one row per program + DD, with the steps that bind it to this DSN
    const users = new Map();
    for (const p of d.programs) {
      const f = fileBy.get(p.program + '|' + p.dd);
      if (!f) continue;
      const k = p.program + '|' + p.dd;
      if (!users.has(k)) users.set(k, {f: f, bindings: f.bindings.filter(b => isDsn(b) && b.dsn === d.dsn), dynamic: false});
      if (p.dynamic) users.get(k).dynamic = true;
    }
    const fileRows = [...users.values()].sort((a, b) => a.f.program.localeCompare(b.f.program) || a.f.dd.localeCompare(b.f.dd))
      .map(u => fileRow(u.f, u.bindings, u.dynamic ? badge('reached by dynamic call', 'gen') : null));
    const facts = el('div', {class: 'schema'},
      el('div', {}, el('b', {}, 'Type: '), d.type || 'unknown', ' ', d.type_basis ? badge(d.type_basis.kind, TYPE_BASIS[d.type_basis.kind] || 'info') : null,
        d.type_basis ? el('span', {class: 'muted'}, ' ' + d.type_basis.detail + (d.type_basis.source ? ' @ ' + d.type_basis.source : '')) : null),
      el('div', {}, el('b', {}, 'Defined by: '), d.definition
        ? el('span', {class: 'mono'}, d.definition.kind + (d.definition.organization ? ' ' + d.definition.organization : '') +
            (d.definition.keys ? ' KEYS(' + d.definition.keys + ')' : '') + ' @ ' + d.definition.source +
            (d.alternate_indexes.length ? ' · AIX ' + d.alternate_indexes.join(' ') : '') +
            (d.paths && d.paths.length ? ' · PATH ' + d.paths.join(' ') : ''))
        : el('span', {class: 'muted'}, 'no IDCAMS DEFINE / CSD definition in the scanned input')),
      d.cics_files.length || d.cics_tdqueues.length ? el('div', {}, el('b', {}, 'CICS: '), el('span', {class: 'mono'},
        [...d.cics_files.map(c => 'FILE ' + c.file + (c.allowed ? ' [' + c.allowed + ']' : '')), ...d.cics_tdqueues.map(c => 'TDQ ' + c.queue)].join(' · '))) : null,
      d.utility_use.length ? el('div', {}, el('b', {}, 'Utility use: '), el('span', {class: 'mono muted'},
        [...new Set(d.utility_use.map(u => u.utility + ' ' + u.job + '.' + u.step + ' ' + u.dd))].join(' · '))) : null,
      d.deleted_by.length ? el('div', {}, el('b', {}, 'Deleted by: '), el('span', {class: 'mono muted'}, d.deleted_by.map(x => x.job + '.' + x.step).join(' · '))) : null);
    const progs = [...new Set(d.programs.map(p => p.program))];
    dsItems.append(item(anchorId('dsn', d.dsn), d.dsn, [
        badge(dsType(d), ['KSDS', 'ESDS', 'RRDS', 'LDS', 'AIX', 'PATH'].includes(dsType(d)) ? 'det' : 'info'),
        d.type_basis ? badge(d.type_basis.kind, TYPE_BASIS[d.type_basis.kind] || 'info') : null,
        d.definition ? badge('defined ' + d.definition.kind, 'det') : null,
        d.cics_files.length ? badge('CICS FILE', 'gen') : null,
        d.deleted_by.length ? badge('deleted by ' + d.deleted_by.length + ' step(s)', 'medium') : null,
        el('span', {class: 'spacer'}),
        el('span', {class: 'muted'}, progs.length ? progs.length + ' program(s): ' + progs.join(' ') :
          d.utility_use.length ? 'utility use only' : 'referenced only')],
      {'data-kind': 'dataset', 'data-name': d.dsn, 'data-type': dsType(d),
       'data-status': d.definition ? 'defined' : 'no definition', 'data-program': progs[0] || ''},
      [facts, fileRows.length ? el('h4', {}, 'COBOL files bound to this dataset') : null,
       fileRows.length ? table(FILE_COLS, fileRows) : null], false));
  }
  // COBOL file declarations that no scanned DD binds to a DSN are evidence, not
  // datasets: SYSOUT / in-stream / passed temporaries say where the data went
  // instead; a missing DD is an open ask. One item per declaration.
  const NON_DSN = {missing: 'no DSN — DD not allocated', temporary: 'temporary (&&) dataset', sysout: 'SYSOUT', 'in-stream': 'in-stream data (DD *)'};
  const nonDsn = conn.files.map(f => ({f: f, b: f.bindings.filter(b => !isDsn(b))}))
    .filter(x => x.b.length || (!x.f.bindings.length && x.f.binding_status !== 'sort-work'));
  for (const {f, b} of nonDsn.sort((a, b) => BIND_RANK[a.f.binding_status] - BIND_RANK[b.f.binding_status] || a.f.program.localeCompare(b.f.program) || a.f.dd.localeCompare(b.f.dd))) {
    const kinds = [...new Set(b.map(x => x.kind))];
    const why = kinds.length ? kinds.map(k => NON_DSN[k] || k).join(' / ')
      : f.binding_status === 'online-only' ? 'online only — no batch DD; the CSD FILE entry names the dataset'
      : f.reached === 'dynamic' ? 'no DSN — reached only by a dynamic call' : 'no DSN — no scanned JCL runs this program';
    const bad = !okBind(f);
    dsItems.append(item(anchorId('file', f.program + '.' + f.dd), f.program + ' ' + f.file + ' (DD ' + f.dd + ')', [
        badge(f.binding_status, f.binding_status === 'bound' ? 'det' : ['sort-work', 'online-only'].includes(f.binding_status) ? 'info' : 'high'),
        badge(why, bad ? 'high' : 'info'),
        f.reached === 'dynamic' ? badge('reached by dynamic call', 'gen') : null,
        el('span', {class: 'spacer'}),
        el('span', {class: 'muted'}, f.binding_status === 'partial' ? 'other steps bind it to a DSN — see that dataset' : 'COBOL file declaration, no dataset in this scan')],
      {'data-kind': 'COBOL file without DSN', 'data-name': f.program + '.' + f.dd, 'data-type': why,
       'data-status': f.binding_status, 'data-program': f.program},
      [bad ? el('div', {class: 'request'}, 'ASK: the JCL (or the CICS FCT / CSD entry) that allocates DD ' + f.dd + ' for ' + f.program +
          (b.length ? ' in ' + [...new Set(b.filter(x => x.kind === 'missing').map(x => x.job + '.' + x.step))].join(', ') : '') + ' — without it the data this file touches cannot be named.') : null,
       table(FILE_COLS, [fileRow(f, b)])], false));
  }
  const dsLegend = el('div', {class: 'legend'},
    el('div', {}, el('b', {}, 'How a dataset’s type is known'), ' — strongest evidence first; the first one found is used:'),
    el('div', {}, badge('idcams-define', 'det'), ' DEFINE CLUSTER INDEXED / NONINDEXED / NUMBERED / LINEAR scanned: KSDS / ESDS / RRDS / LDS is a fact of the catalog definition.'),
    el('div', {}, badge('dd-recorg', 'det'), ' the DD allocates it with RECORG=KS/ES/RR/LS (SMS-managed VSAM).'),
    el('div', {}, badge('cobol-organization', 'gen'), ' a program declares it ORGANIZATION IS INDEXED (KSDS) or RELATIVE (RRDS) — what the program expects, not what is cataloged.'),
    el('div', {}, badge('cobol-assign-as', 'gen'), ' ASSIGN TO AS-ddname: the program opens it as VSAM ESDS. ', badge('cics-file', 'gen'), ' named as DSNAME by a CSD DEFINE FILE: CICS file control reads VSAM only.'),
    el('div', {}, badge('dd-amp', 'gen'), ' AMP= on the DD: VSAM, organization not stated. ', badge('dd-dcb', 'gen'), ' DCB / RECFM / DSORG on the DD: a non-VSAM (QSAM/BSAM) dataset.'),
    el('div', {}, badge('no-catalog-evidence', 'medium'), ' only plain DDs and/or ORGANIZATION IS SEQUENTIAL: COBOL declares a QSAM file and a VSAM ESDS the same way, so without a DEFINE, LISTCAT or RECORG the scan cannot tell — QSAM is the usual reading, ESDS is not excluded.'),
    el('div', {class: 'muted'}, 'A dataset item says what exists (the DSN); the COBOL files inside it say how each program uses it — one DSN is used by many programs, and one file can bind to different DSNs per job. ' +
      'A COBOL file that no scanned DD binds to a DSN is listed as its own item (kind "COBOL file without DSN"): SYSOUT, in-stream data, a passed temporary, or a DD that is simply not allocated — the last is an open ask, never a guess.'));
  const unbound = conn.files.filter(f => !okBind(f)).length;
  intro('datasets-intro', [badge(conn.datasets.length + ' DSNs', 'det'), badge(conn.summary.vsam_defined + ' VSAM defined by IDCAMS', 'info'),
      badge(conn.files.length + ' COBOL file declarations', 'info'), unbound ? badge(unbound + ' without a DSN', 'high') : badge('all files bound', 'det')],
    'One item per DSN: what defines it, and every COBOL file, CICS file and utility that touches it.');
  connBoxes.datasets.append(dsLegend, dsItems);
  toolbar('t-datasets', 'datasets', [['kind', 'kinds'], ['type', 'types'], ['status', 'definition / binding statuses'], ['program', 'programs']], 'details.item', PAGE,
          [['name', 'DSN'], ['type', 'type'], ['program', 'program']]);
  addCount('Data', conn.datasets.length);

  // -- CICS ------------------------------------------------------------------------
  const cics = conn.cics;
  const cDiv = el('div', {});
  const csdCell = c => Array.isArray(c) ? mono(lines(c.map(m => 'TSMODEL ' + m.model + ' PREFIX(' + m.prefix + ')' + (m.location ? ' ' + m.location : '') + ' @ ' + m.source)))
                     : c ? mono((c.attrs && (c.attrs.DSNAME || c.attrs.DDNAME) ? (c.attrs.DSNAME || 'DD ' + c.attrs.DDNAME) + ' ' : '') + '@ ' + c.source, '')
                          : el('td', {}, cics.csd_scanned ? badge('not in CSD', 'high') : el('span', {class: 'muted'}, 'no CSD input'));
  const useLines = uses => lines(uses.map(u => u.program + ' ' + u.command + (u.map ? ' ' + u.map : '') + ' @ ' + u.source));
  const resGroup = (title, items, nameKey, extra) => {
    if (!items.length) return;
    cDiv.append(group(title, [badge(items.length, 'info')],
      table(['Name', 'Used by (program command @ source)', 'CSD definition', extra || ''],
        items.map(it => row({[CAT]: 'CICS', 'data-name': it[nameKey], 'data-status': it.csd ? 'defined' : 'undefined',
                             'data-program': (it.uses[0] || {}).program || ''},
          mono(it[nameKey]), mono(useLines(it.uses)), csdCell(it.csd),
          el('td', {class: 'muted'}, extra === 'Access' ? [...new Set(it.uses.map(u => u.command))].join(' ') :
             extra === 'Program' && it.csd ? it.csd.program : '')))), 'sub', false));
  };
  resGroup('Files (EXEC CICS READ/WRITE/REWRITE/DELETE/STARTBR/READNEXT/READPREV/ENDBR)', cics.files, 'name', 'Access');
  resGroup('TS queues (WRITEQ/READQ/DELETEQ TS)', cics.ts_queues, 'name', 'Access');
  resGroup('TD queues (WRITEQ/READQ/DELETEQ TD)', cics.td_queues, 'name', 'Access');
  resGroup('Transactions (START / RETURN TRANSID)', cics.transactions, 'transid', 'Program');
  resGroup('Maps (SEND/RECEIVE MAP)', cics.maps, 'mapset', '');
  if (cics.program_links.length) cDiv.append(group('Program links (LINK / XCTL)', [badge(cics.program_links.length, 'info'),
      badge(cics.program_links.filter(l => l.resolution === 'variable').length + ' via data item → dynamic call ladder', 'gen')],
    table(['From', 'Command', 'To', 'How named', 'COMMAREA / CHANNEL / SYSID', 'Target', 'Source'],
      cics.program_links.map(l => row({[CAT]: 'CICS', 'data-program': l.program, 'data-name': l.resource || l.resolution_detail,
                                       'data-status': l.resolution === 'variable' ? 'dynamic' : l.in_inventory ? 'in-inventory' : 'external'},
        mono(l.program), mono(l.command), mono(l.resource || '?'),
        el('td', {class: 'muted'}, l.resolution + (l.resolution_detail ? ' — ' + l.resolution_detail : '')),
        mono([l.commarea && 'COMMAREA', l.channel && 'CHANNEL ' + l.channel, l.sysid && 'SYSID ' + l.sysid].filter(Boolean).join(' ')),
        el('td', {}, l.resolution === 'variable' ? badge('see dynamic calls', 'gen') :
           l.in_inventory ? badge('in inventory', 'det') : badge('outside scanned source', 'high'),
           l.csd ? el('div', {class: 'mono muted'}, 'CSD @ ' + l.csd.source) : null),
        mono(l.source, 'muted')))), 'sub', false));
  // EXEC CICS WEB / INVOKE and the connectivity definitions are cross-system, so
  // they are rendered under Interfaces, not here with the region's own resources.
  const nCmds = Object.values(cics.commands_by_program).reduce((n, m) => n + Object.values(m).reduce((a, b) => a + b, 0), 0);
  intro('cics-intro', [badge(Object.keys(cics.commands_by_program).length + ' programs', 'det'), badge(nCmds + ' EXEC CICS', 'info'),
      badge(cics.csd_scanned ? 'CSD scanned' : 'no CSD input', cics.csd_scanned ? 'det' : 'medium')],
    'Resources this module needs installed in a region, grouped by type. Cross-system connectivity is under Interfaces.');
  connBoxes.cics.append(nCmds ? cDiv : el('div', {class: 'empty'}, 'No EXEC CICS in the scanned programs.'));
  toolbar('t-cics', 'cics', [['name', 'resources'], ['program', 'programs'], ['status', 'CSD statuses']], 'tbody tr', PAGE);
  addCount('Online / region', cics.files.length + cics.ts_queues.length + cics.td_queues.length +
    cics.transactions.length + cics.maps.length + cics.program_links.length);

  // -- modules outside the scanned source, grouped by what the artifacts say they are ------
  const ext = conn.external;
  const modules = ext.modules || [];
  const candidates = ext.candidate_modules || [];
  // the order the classes are read in: what is settled first, what is still open last
  const CLASS_ORDER = ['in-estate-built', 'in-estate-catalogued', 'in-estate-library', 'vendor',
                       'product-runtime', 'utility', 'launcher', 'build-tool', 'unsupplied'];
  const CLASS_LABEL = {
    'in-estate-built': 'This estate’s own code — the source was not supplied',
    'in-estate-catalogued': 'In the estate catalog — the member is outside this scan’s roots',
    'in-estate-library': 'Lives in a library or CICS group the scanned programs use',
    'vendor': 'Third-party product programs',
    'product-runtime': 'Runtime / product components',
    'utility': 'System and product utilities',
    'launcher': 'Launchers',
    'build-tool': 'Build tools',
    'unsupplied': 'Nothing in the scan says what these are',
  };
  const CLASS_TONE = {'in-estate-built': 'det', 'in-estate-catalogued': 'det',
                      'in-estate-library': 'gen', 'vendor': 'info',
                      'product-runtime': 'info', 'utility': 'info', 'launcher': 'info',
                      'build-tool': 'info', 'unsupplied': 'high'};
  const classOf = m => ((m.classification || {}).value) || 'unsupplied';
  const clsBlock = m => {
    const c = m.classification || {};
    const extra = [...(c.considered || []).map(o => 'also fired: ' + o.value + ' — ' + o.basis),
                   ...(c.hints || []).map(h => 'hint: ' + h.fact),
                   ...(c.conflict ? ['conflict: ' + c.conflict.why] : [])];
    const b = m.binding || null;
    return el('div', {class: 'schema'},
      el('div', {}, el('b', {}, 'What it is: '), badge(classOf(m), CLASS_TONE[classOf(m)] || 'info'),
        badge(c.confidence || 'no verdict', c.confidence === 'proven' ? 'det' : c.confidence ? 'gen' : 'high'),
        ' ', c.basis || ''),
      el('ul', {class: 'evidence'}, ...(c.evidence || []).map(e => el('li', {class: 'mono muted'}, e))),
      extra.length ? el('ul', {class: 'evidence'}, ...extra.map(t => el('li', {class: 'muted'}, t))) : null,
      b ? el('div', {}, el('b', {}, 'Bound by the module-classification skill: '),
            badge(b.kind, 'gen'), badge(b.confirmed ? 'confirmed' : 'derived, not confirmed', b.confirmed ? 'det' : 'gen'),
            ' ', [b.module, b.product, b.component].filter(Boolean).join(' · '),
            b.reasoning ? el('span', {class: 'muted'}, ' — ' + b.reasoning) : null) : null);
  };
  // Who the name belongs to is the reading order: this module's own code, a
  // sibling module of the estate, a product, the platform, then what nothing
  // accounts for. The classification stays on the row as the evidence for it.
  const PLATFORM = new Set(['product-runtime', 'utility', 'launcher', 'build-tool']);
  const ownerOf = m => {
    const b = m.binding || {};
    if (b.kind === 'application-module' && b.module) return 'module:' + b.module;
    if (classOf(m) === 'in-estate-catalogued') return (m.classification || {}).module
      ? 'module:' + (m.classification || {}).module : 'estate';
    if (['in-estate-built', 'in-estate-library'].includes(classOf(m))) return 'module:' + MODULE;
    if (b.kind === 'vendor-product' || classOf(m) === 'vendor') return 'product';
    if (b.kind === 'utility' || b.kind === 'runtime-component' || PLATFORM.has(classOf(m))) return 'platform';
    return 'unknown';
  };
  const OWNER_RANK = {'estate': 1, 'product': 2, 'platform': 3, 'unknown': 4};
  const ownerRank = o => o === 'module:' + MODULE ? 0 : (OWNER_RANK[o] == null ? 1 : OWNER_RANK[o]);
  const ownerTitle = o => o === 'module:' + MODULE ? MODULE + ' — this module’s own code, source not supplied'
    : o.startsWith('module:') ? o.slice(7) + ' — another module of the estate'
    : o === 'estate' ? 'In the estate catalog — no module map places the member yet'
    : o === 'product' ? 'Third-party products'
    : o === 'platform' ? 'Runtime components, launchers and utilities'
    : 'Unknown — nothing in the scan says what these are';
  const ownerFacet = o => o.startsWith('module:') ? o.slice(7) : o;
  const mItem = m => {
    const where = [...m.load_libraries.map(l => l.dd + ' ' + l.dsn + ' (' + l.job + '.' + l.step + ')'),
                   m.csd ? 'CSD DEFINE PROGRAM group ' + m.csd.group + (m.remote_system ? ' REMOTESYSTEM(' + m.remote_system + ')' : '') +
                           ((m.csd.attrs || {}).DESCRIPTION ? ' — ' + m.csd.attrs.DESCRIPTION : '') + ' @ ' + m.csd.source : null].filter(Boolean);
    const idn = m.identity || {};
    const statuses = [...new Set(m.references.map(r => r.status || 'static'))];
    return item(anchorId('mod', m.name), m.name, [
        m.candidate_only ? badge('candidate name — the call is not proven', 'gen') : null,
        idn.likely ? el('span', {class: 'likely'}, 'likely: ' + idn.likely) : null,
        ...m.via.map(v => badge(v, v.startsWith('dynamic') ? 'gen' : 'external')),
        m.remote_system ? badge('remote ' + m.remote_system, 'medium') : null,
        el('span', {class: 'spacer'}),
        el('span', {class: 'muted'}, (m.callers.length ? 'called from ' + m.callers.join(' ') : '') +
          (m.steps.length ? (m.callers.length ? ', ' : '') + 'run by ' + m.steps.join(', ') : '') +
          (where.length ? ' · ' + (m.load_libraries.length ? 'STEPLIB/JOBLIB: ' + [...new Set(m.load_libraries.map(l => l.dsn))].join(', ') : 'CSD-defined') : ' · no load library or CSD definition in the scanned JCL/CSD'))],
      {'data-kind': m.via.some(v => v.startsWith('dynamic')) ? (m.via.length > 1 ? 'static + dynamic' : 'dynamic') : 'static',
       'data-name': m.name, 'data-status': statuses.join(' / '), 'data-program': m.callers[0] || (m.steps[0] || '').split('.')[0],
       'data-class': CLASS_LABEL[classOf(m)] || classOf(m), 'data-owner': ownerFacet(ownerOf(m)),
       'data-proof': m.candidate_only ? 'candidate — the call is not proven' : 'the scan proves the call',
       'data-likely': idn.likely ? 'identified from evidence' : 'unidentified'},
      [clsBlock(m),
       idn.likely ? el('div', {class: 'schema'},
            el('div', {}, el('b', {}, 'What it likely is: '), idn.likely,
              el('span', {class: 'muted'}, ' — derived only from the facts below; who owns it is not inferred')),
            el('ul', {class: 'evidence'}, ...(idn.evidence || []).map(e => el('li', {}, e.fact,
              e.source ? el('span', {class: 'src mono muted'}, ' @ ' + e.source) : null))),
            el('div', {class: 'request'}, 'STILL OPEN: ' + idn.open)) : null,
       where.length ? el('div', {class: 'schema'}, el('b', {}, 'Where it lives: '), el('span', {class: 'mono'}, where.join(' · '))) : null,
       el('h4', {}, 'How it is reached'),
       table(['Reached via', 'From', 'Status', 'Named by (what says this is the target)', 'Source'], m.references.map(r => row({'data-program': r.program || r.job || ''},
         mono(r.via), mono(r.program || (r.job + '.' + r.step)), el('td', {}, r.status ? badge(r.status, r.status) : ''),
         el('td', {class: 'mono muted'}, lines((r.named_by || []).map(nb => nb.how + ' @ ' + nb.source))),
         mono(r.source, 'muted'))))], true);
  };
  // a candidate name is still a name this module reaches for: it belongs under
  // the module that owns it, marked unproven, not in a list of its own
  const named = [...modules, ...candidates];
  const byOwner = [...groupBy(named, ownerOf).entries()]
    .sort((a, b) => ownerRank(a[0]) - ownerRank(b[0]) || a[0].localeCompare(b[0]));
  const mDiv = el('div', {});
  for (const [owner, ms] of byOwner) {
    const inner = el('div', {class: 'items'},
      ...ms.sort((a, b) => a.name.localeCompare(b.name)).map(mItem));
    mDiv.append(group(ownerTitle(owner), [badge(ms.length, owner === 'unknown' ? 'high' : 'info')],
                      inner, 'sub', true));
  }
  const byClass = groupBy(modules, classOf);
  intro('external-intro', CLASS_ORDER.filter(c => byClass.has(c)).map(c =>
      badge(byClass.get(c).length + ' ' + c, CLASS_TONE[c])).concat(
      candidates.length ? [badge(candidates.length + ' candidate name(s)', 'gen')] : []),
    'Named targets outside the scanned source, graded against the artifacts that can settle them. A name no artifact accounts for is `unsupplied`, not “external”.');
  connBoxes.external.append(named.length ? mDiv : el('div', {class: 'empty'},
    'Every CALL, LINK/XCTL and EXEC PGM target resolves inside the scanned source (runtime routines excepted — see below).'));
  toolbar('t-external', 'external', [['owner', 'who it belongs to'], ['class', 'what it is'], ['proof', 'call proven?'], ['kind', 'how reached'], ['likely', 'identity'], ['program', 'callers']], 'details.item', PAGE,
          [['name', 'module'], ['class', 'what it is'], ['program', 'caller']]);
  addCount('Code', named.length);

  // -- runtime routines, dynamic call sites, launchers, utilities ------------------------------
  const eDiv = el('div', {});
  const runtime = ext.runtime_routines || [];
  eDiv.append(group('Runtime / product routines called (not application modules)', [badge(runtime.length, 'info')],
    table(['Routine', 'Product', 'Callers', 'Sources'], runtime.map(r => row({[CAT]: 'runtime', 'data-program': r.callers[0] || '', 'data-name': r.name, 'data-status': 'runtime'},
      mono(r.name), el('td', {}, r.family || ''), mono(r.callers.join(' ')), mono(lines(r.sources), 'muted')))), 'sub', false));
  eDiv.append(group('Dynamic call sites', [badge(ext.dynamic_calls.length, 'info'), el('span', {class: 'muted'}, 'traced hop by hop, and resolved, under Dynamic calls')],
    table(['Program', 'Construct', 'Operand', 'Status', 'Candidates', 'Source'], ext.dynamic_calls.map(d => row({[CAT]: 'dynamic call', 'data-program': d.program, 'data-name': d.variable, 'data-status': d.status},
      mono(d.program), mono(d.construct), mono(d.variable), el('td', {}, badge(d.status, d.status)), mono((d.candidates || []).join(' ')), mono(d.source, 'muted')))), 'sub', false));
  eDiv.append(group('Launcher steps (IKJEFT01 / DSN RUN, TSO commands)', [badge(ext.launcher_steps.length, 'info')],
    table(['Job.step', 'Launcher', 'Runs', 'PLAN', 'How', 'Other TSO commands', 'Source'], ext.launcher_steps.map(l => row({[CAT]: 'launcher', 'data-program': l.program || '', 'data-name': l.launcher, 'data-status': l.resolution},
      mono(l.job + '.' + l.step), mono(l.launcher), mono(l.program || '?'), mono(l.plan || ''), el('td', {class: 'muted'}, l.resolution),
      mono(lines(l.tso_commands || []), 'muted'), mono(l.source, 'muted')))), 'sub', false));
  // A transfer utility moves data off the estate, so its step is an interface
  // rather than a build-time utility: it is shown and counted under Interfaces.
  const XFER = new Set(DATA.knowledge.file_transfer_programs || []);
  const xferSteps = ext.utility_steps.filter(s => XFER.has(s.utility));
  const utilSteps = ext.utility_steps.filter(s => !XFER.has(s.utility));
  const byUtil = groupBy(utilSteps, u => u.utility);
  eDiv.append(group('Build-time & system utilities (not business runtime)', [badge(utilSteps.length + ' steps', 'info'),
      el('span', {class: 'muted'}, [...byUtil.entries()].map(([u, s]) => u + '×' + s.length).join(' · '))],
    table(['Utility', 'Job.step', 'DDs', 'Source'], [...byUtil.entries()].sort((a, b) => a[0].localeCompare(b[0])).flatMap(([u, ss]) =>
      ss.map(s => row({[CAT]: 'utility', 'data-program': u, 'data-name': s.job + '.' + s.step, 'data-status': 'build'},
        mono(u), mono(s.job + '.' + s.step), mono((s.dds || []).map(d => d.dd + (d.dsn ? '=' + d.dsn : '')).join(' '), 'muted'), mono(s.source, 'muted'))))), 'sub', false));
  intro('runtime-intro', [badge(runtime.length + ' runtime routine(s)', 'info'),
      badge(ext.dynamic_calls.length + ' dynamic call site(s)', ext.dynamic_calls.length ? 'medium' : 'det'),
      badge(ext.launcher_steps.length + ' launcher steps', 'info'), badge(utilSteps.length + ' utility steps', 'info')],
    'Code reached that is not an application module of this inventory; most travels with the platform, an unresolved dynamic target does not.');
  connBoxes.runtime.append(eDiv);
  toolbar('t-runtime', 'runtime', [['cat', 'categories'], ['program', 'programs / utilities'], ['status', 'statuses']], 'tbody tr', PAGE);
  // named things, not sites: one utility run by twenty steps is one name to
  // account for, so the tab count matches what the tab actually lists.
  addCount('Code', runtime.length + new Set(utilSteps.map(s => s.utility)).size
                   + new Set(ext.launcher_steps.map(l => l.launcher)).size);

  // -- interfaces: MQ, CICS cross-system connectivity, file transfer ---------------------------
  const xDiv = el('div', {});
  const cicsExternal = (cics && cics.external) || [];
  xDiv.append(group('MQ / messaging', [badge(ext.mq.length ? ext.mq.length + ' API calls' : 'none detected', ext.mq.length ? 'medium' : 'det')],
    ext.mq.length ? table(['Program', 'API', 'Queue manager / queue', 'Source'], ext.mq.map(m => row({[CAT]: 'mq', 'data-program': m.program, 'data-name': m.api, 'data-status': 'mq'},
        mono(m.program), mono(m.api), el('td', {class: 'muted'}, m.detail || 'names supplied at run time — see ask'), mono(m.source, 'muted'))))
      : el('div', {class: 'empty'}, 'No MQCONN/MQOPEN/MQPUT/MQGET (or CMQV copybook) in the scanned programs — an absence, not an unknown.'), 'sub', ext.mq.length > 0));

// ---- inventory: programs --------------------------------------------------------
const flagsOf = p => [...new Set((p.facts || []).map(f => f.kind))];
const progDiv = document.getElementById('programs');
const progRows = programs.filter(p => p.kind !== 'copybook');

// Every call target is named. What a target *is* comes from the connections
// catalog, where the artifacts were graded (external.modules[].classification);
// without it, only "in this inventory" versus "not in this inventory" is said.
const externalModules = (conn && conn.external && conn.external.modules) || [];
const externalNames = new Set(externalModules.map(m => m.name));
const moduleClass = new Map(externalModules.map(m => [m.name, m.classification || {}]));
const runtimeNames = new Set(((conn && conn.external && conn.external.runtime_routines) || []).map(r => r.name));
const targetClass = name => externalNames.has(name) ? 'external' : runtimeNames.has(name) ? 'runtime'
  : inventoryIds.has(name) ? 'inventory' : 'external';
const TARGET_TITLE = {external: 'not in the scanned source — see Connections › External modules',
                      runtime: 'language / product runtime routine', inventory: 'in this inventory'};
// the graded verdict when there is one, so hovering a name says what it is
const targetTitle = name => {
  const c = moduleClass.get(name);
  return c && c.basis ? c.value + ' — ' + c.basis : TARGET_TITLE[targetClass(name)];
};
const target = name => el('span', {class: 'target ' + targetClass(name), title: targetTitle(name)}, name);
const siteByLine = new Map(sites.map(s => [s.source, s]));
// dynamic target: the variable, then what the trace resolved it to (candidates), if anything
const dynTarget = (p, variable, line) => {
  const s = siteByLine.get(p.path + ':' + line);
  const cands = (s && s.candidates) || [];
  const named = cands.length <= 6 ? cands : cands.filter(c => targetClass(c.name) !== 'inventory');
  const rest = cands.length - named.length;
  return el('span', {}, el('span', {class: 'mono muted'}, variable),
    cands.length ? el('span', {}, ' → ', ...named.flatMap((c, i) => [i ? ', ' : null, target(c.name)]),
      rest ? el('span', {class: 'muted'}, (named.length ? ' + ' : '') + rest + ' in this inventory') : null) : null,
    s ? el('span', {class: 'muted'}, ' (', el('a', {class: 'xref', href: '#' + dcAnchor(s.source)}, s.status + ' — ladder'), ')') : null);
};
const extModulesOf = p => externalModules.filter(m => m.references.some(r => r.program === p.id)).map(m => m.name);
const callCell = p => {
  const c = p.calls || {};
  const items = [
    ...(c.static || []).map(s => el('span', {}, 'CALL ', target(s.target))),
    ...(c.dynamic || []).map(d => el('span', {}, 'CALL ', dynTarget(p, d.variable, d.line))),
    ...(c.cancel || []).map(d => el('span', {}, 'CANCEL ', d.target ? target(d.target) : dynTarget(p, d.variable, d.line))),
    ...(c.cics || []).map(x => el('span', {}, 'CICS ' + x.command + ' ',
        x.program ? target(x.program) : dynTarget(p, x.variable, x.line))),
    ...(c.sql || []).map(s => el('span', {}, 'SQL CALL ', el('span', {class: 'mono'}, s.target || ':' + s.variable), el('span', {class: 'muted'}, ' (stored procedure)'))),
  ];
  const seen = new Set();
  return el('td', {class: 'calls'}, ...items.filter(i => !seen.has(i.textContent) && seen.add(i.textContent)).map(i => el('div', {}, i)));
};
// Programs referenced but not in the scan: every named transfer of control whose
// target is neither a scanned PROGRAM-ID / ENTRY nor a runtime routine. Each is
// listed as a row of its own (kind "missing") so the tab can be filtered to them.
const MISSING = 'missing — referenced, not in scan';
const missingPrograms = new Map();  // name -> [{via, by}]
const noteMissing = (name, via, by) => {
  if (!name || inventoryIds.has(name) || runtimeNames.has(name) || isSystemName(name)) return;
  if (!missingPrograms.has(name)) missingPrograms.set(name, []);
  missingPrograms.get(name).push({via, by});
};
function isSystemName(name) {
  return ((DATA.knowledge && DATA.knowledge.system_routine_prefixes) || []).some(pfx => name.startsWith(pfx));
}
for (const p of progRows) {
  const c = p.calls || {};
  for (const s of c.static || []) if (!s.system) noteMissing(s.target, 'CALL', p.id);
  for (const d of c.cancel || []) if (d.target) noteMissing(d.target, 'CANCEL', p.id);
  for (const x of c.cics || []) noteMissing(x.program, 'CICS ' + x.command, p.id);
}
for (const s of sites) for (const c of s.candidates || []) if (!c.in_inventory) noteMissing(c.name, 'dynamic ' + s.construct + ' candidate', s.program);
for (const s of steps) if (s.program) noteMissing(s.program, 'EXEC PGM', s.job + '.' + s.step);
const missingProgramRows = [...missingPrograms.entries()].sort((a, b) => a[0].localeCompare(b[0]));
const refsCell = refs => {

  return el('td', {class: 'mono'}, ...[...byVia.entries()].map(([via, rs]) =>
    el('div', {}, via + ' from ' + [...new Set(rs.map(r => r.by))].sort().join(', '))));
};
progDiv.append(table(['ID', 'Kind', 'What it does', 'Path', 'Lines', 'SQL', 'Files (org)', 'Calls (target)', 'External modules reached', 'Includes', 'Flags'], [
  ...progRows.map(p => {

    return el('tr', {'data-kind': p.kind, 'data-miss': 'in scan', 'data-sql': p.uses_sql ? 'DB2' : 'no SQL',
                     'data-ext': ext.length ? 'reaches an external module' : 'none', 'data-flags': flagsOf(p).join(' ') || 'none'},
    el('td', {class: 'mono'}, p.id + (p.nested_in ? ' (in ' + p.nested_in + ')' : '')),
    el('td', {}, badge(p.kind, p.kind)),
    descCell('program', p.id),
    el('td', {class: 'mono muted'}, p.path),
    el('td', {}, p.lines),
    el('td', {}, p.uses_sql ? 'DB2' : ''),
    el('td', {class: 'mono'}, (p.files || []).map(f => f.assign + ' (' + f.organization + ')').join(', ')),
    callCell(p),
    el('td', {class: 'mono'}, ...ext.flatMap((n, i) => [i ? ', ' : null, target(n)]).filter(Boolean)),
    el('td', {class: 'mono'}, (p.includes || []).map(x => x.name + (x.mechanism === 'copy' ? '' : ' (' + x.mechanism + ')')).join(', ')),
    el('td', {class: 'mono muted'}, flagsOf(p).join(', ')));

      el('td', {class: 'mono'}, target(name)),

      el('td', {class: 'muted'}, DESC_UNKNOWN),
      el('td', {class: 'muted'}, externalNames.has(name) ? 'no scanned source — see Connections › External modules' : 'no scanned source defines it'),
      el('td', {}, ''), el('td', {}, ''), el('td', {}, ''),
      refsCell(refs),
      el('td', {}, ''), el('td', {}, ''), el('td', {}, '')))]));

toolbar('t-copybooks', 'copybooks', [['miss', 'copybooks (in scan / missing)'], ['used', 'usage']], 'tbody tr', PAGE);

// ---- inventory: jobs, expanding to the steps they run --------------------------------
const schedRows = tables.flatMap(t => {

  for (const e of t.edges) (predsOf[e.to] = predsOf[e.to] || []).push(e.from);

// Scheduled jobs with no scanned JCL member are rows too (kind "missing").
const missingJobs = schedRows.filter(({sj}) => !(scannedJobs.has(sj.name) || scannedJobs.has(sj.memname)));
document.getElementById('jobs-intro').textContent = steps.length
  ? 'One row per job; expand it for the steps it runs. ' +
    unresolvedSteps.length + ' of ' + steps.length + ' step(s) across ' + jobs.length + ' job(s) are unresolved.'
  : '';
// the steps of one job, as a table inside that job's detail row
const JOB_STEP_COLUMNS = ['Step', 'Via PROC', 'PGM=', 'Kind', 'Program', 'Status', 'Why', 'Plan', 'Source'];
function jobStepRow(s) {
  const st = stepStatuses.get(s);
  // the data-* here are the sub-row half of the job row's rolled-up "step*"
  // facets, so a step filter narrows a job's steps to the matching ones
  return el('tr', {id: stepAnchor(s), 'data-kind': s.kind, 'data-status': st.label,
                   'data-program': s.program || '(none)', 'data-proc': s.proc || '',

    el('td', {class: 'mono'}, s.program || ''),
    el('td', {}, badge(st.label, st.cls)),
    el('td', {class: 'muted'}, st.note),
    el('td', {class: 'mono'}, s.plan || ''),
    el('td', {class: 'mono muted'}, s.source));
}
// A collapsed row says what its steps add up to: the scanner's status classes
// rolled up, never a bare "has a step with no program".
const STATUS_ROLLUP = [['unresolved', 'unresolved'], ['unsupplied-module', 'source not supplied'],
                       ['product-module', 'product / utility'], ['built', 'built here'],
                       ['utility', 'utility / TSO only'], ['resolved', 'resolved'], ['unknown', 'unknown']];
function statusRollup(stepList) {
  const byCls = groupBy(stepList, s => stepStatuses.get(s).cls);
  return STATUS_ROLLUP.filter(([cls]) => byCls.has(cls))
    .map(([cls, label]) => badge(byCls.get(cls).length + ' ' + label, cls));
}
// a detail row carrying one member's steps, hidden until its row is expanded
function detailRow(id, columns, rows, width) {
  return el('tr', {class: 'detail', id: id, hidden: ''},
    el('td', {colspan: width}, rows.length ? table(columns, rows) : el('div', {class: 'empty'}, 'No steps.')));
}
const JOB_COLUMNS = ['', 'Job', 'Kind', 'What it does', 'Scheduled in', 'Ordered', 'Depends on',

      el('td', {}, ''), el('td', {}, ''),

toolbar('t-jobs', 'jobs', [['miss', 'jobs (in scan / missing)'], ['kind', 'kinds'], ['sched', 'scheduling'],
