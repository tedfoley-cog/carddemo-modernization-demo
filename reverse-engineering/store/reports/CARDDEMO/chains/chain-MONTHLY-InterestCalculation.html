const procUsers = new Map();
for (const s of steps) if (s.proc) {
  if (!procUsers.has(s.proc)) procUsers.set(s.proc, new Map());
  const m = procUsers.get(s.proc);
  m.set(s.job, (m.get(s.job) || 0) + 1);
}
// job steps a declared PROC step expanded into: PROC + step name is the join
const expansionsOf = (proc, stepName) => steps.filter(s => s.proc === proc && s.proc_step === stepName);
const missingProcs = [...new Set(steps.filter(s => s.kind === 'missing-proc').map(s => s.proc).filter(Boolean))];
// JCL INCLUDE members that could not be spliced are members of the same libraries
const missingIncludes = (DATA.jobs && DATA.jobs.missing_includes) || [];
document.getElementById('procs-intro').textContent = procDefs.size
  ? 'One row per PROC member; expand it for the steps it declares. &SYMBOLICs are shown as written.'
  : '';
const procRows = [...procNames.map(n => [n, 'loaded']), ...missingProcs.filter(n => !procNames.includes(n)).map(n => [n, 'missing'])]
  .sort((a, b) => a[0].localeCompare(b[0]));
const PROC_STEP_COLUMNS = ['Step', 'PGM=', 'Via PROC', 'PARM', 'COND', 'Symbolics', 'DDs', 'Runs as', 'Source'];
function procStepRow(def, st) {
  const runs = expansionsOf(def.name, st.step);
  return el('tr', {id: procStepAnchor(def.name, st), 'data-pgm': st.pgm || '',
                   'data-symbolic': st.symbolics.length ? 'uses a symbolic' : 'fully literal'},
    el('td', {class: 'mono'}, st.step),
    el('td', {class: 'mono'}, st.pgm || ''),
    el('td', {class: 'mono'}, st.proc ? xref(anchorId('proc', st.proc), st.proc, 'nested PROC') : ''),
    el('td', {class: 'mono'}, st.parm || ''),
    el('td', {class: 'mono'}, st.cond || ''),
    el('td', {class: 'mono muted'}, st.symbolics.join(' ')),
    el('td', {class: 'mono muted'}, st.dds.map(d => d.name).join(' ')),
    el('td', {class: 'mono'}, runs.length
      ? el('span', {}, ...runs.flatMap((s, i) => [i ? ', ' : null,
          xref(stepAnchor(s), s.job + '.' + s.step, 'the job step this declaration expanded into')]))
      : st.proc
        // a step that EXECs another PROC runs that PROC's steps, not one of its own
        ? el('span', {class: 'muted'}, 'the steps of ' + st.proc)
        : el('span', {class: 'muted'}, 'not EXECed by a scanned job')),
    el('td', {class: 'mono muted'}, st.source));
}
const PROC_COLUMNS = ['', 'Member', 'Kind', 'What it does', 'Status', 'Steps',
                      'EXECed / INCLUDEd by (job: expanded steps)'];
document.getElementById('procs').append(table(PROC_COLUMNS, [
  ...procRows.flatMap(([n, status]) => {
    const users = [...(procUsers.get(n) || new Map()).entries()].sort();
    const def = procDefs.get(n);
    const detail = def ? anchorId('procsteps', n) : null;
    const row = el('tr', {class: 'procrow' + (status === 'missing' ? ' missing' : ''), id: anchorId('proc', n),
                     'data-detail': detail, 'data-kind': 'PROC', 'data-status': status,
                     'data-miss': status === 'loaded' ? 'in scan' : MISSING,
                     'data-used': users.length ? 'EXECed by a scanned job' : 'never EXECed in this scan',
                     'data-steppgm': def ? [...new Set(def.steps.map(st => st.pgm).filter(Boolean))].join('|') : ''},
      def ? caretCell('show the steps ' + n + ' declares') : el('td', {class: 'exp'}, ''),
      el('td', {class: 'mono'}, n),
      el('td', {}, badge('PROC', 'proc')),
      status === 'loaded' ? descCell('proc', n) : el('td', {class: 'muted'}, DESC_UNKNOWN),
      el('td', {}, badge(status === 'loaded' ? 'loaded' : 'missing PROC', status === 'loaded' ? 'det' : 'unresolved')),
      el('td', {}, def ? def.steps.length : ''),
      el('td', {class: 'mono'}, users.map(([j, k]) => j + ': ' + k).join(', ') || el('span', {class: 'muted'}, 'not EXECed by a scanned job')));
    return def
      ? [row, detailRow(detail, PROC_STEP_COLUMNS, def.steps.map(st => procStepRow(def, st)), PROC_COLUMNS.length)]
      : [row];
  }),
  ...[...groupBy(missingIncludes, m => m.member).entries()].sort((a, b) => a[0].localeCompare(b[0])).map(([member, ms]) =>
    el('tr', {class: 'procrow missing', 'data-kind': 'INCLUDE', 'data-status': 'missing', 'data-miss': MISSING},
      el('td', {class: 'exp'}, ''),
      el('td', {class: 'mono'}, member),
      el('td', {}, badge('INCLUDE', 'include')),
      el('td', {class: 'muted'}, DESC_UNKNOWN),
      el('td', {}, badge('missing INCLUDE', 'unresolved')),
      el('td', {}, ''),
      el('td', {class: 'mono'}, ms.map(m => m.source + (m.reason && m.reason !== 'not-found' ? ' (' + m.reason + ')' : '')).join(', '))))]));
toolbar('t-procs', 'procs', [['miss', 'members (in scan / missing)'], ['kind', 'kinds'], ['status', 'statuses'],
                             ['used', 'usage'], ['steppgm', 'steps running', true]], 'tbody tr.procrow', PAGE);

// ---- inventory: schedules (one row per scheduled job) -----------------------------------
document.getElementById('schedules').append(table(
  ['Table', 'Application', 'Calendar', 'Ordered', 'Job', 'Member', 'Level', 'Depends on', 'Window', 'Critical', 'In scan', 'Description'],
  schedRows.map(({t, sj, preds}) => {
    const known = scannedJobs.has(sj.name) || scannedJobs.has(sj.memname);
    return el('tr', {class: known ? '' : 'missing', 'data-table': t.name, 'data-app': t.application || '?',
                     'data-miss': known ? 'JCL in scan' : MISSING,
                     'data-critical': sj.critical ? 'critical' : 'normal'},
      el('td', {class: 'mono'}, t.name), el('td', {class: 'mono'}, t.application || '?'),
      el('td', {class: 'mono'}, schedCal(sj)),
      el('td', {class: 'mono'}, schedWhen(sj)),
      el('td', {class: 'mono'}, sj.name), el('td', {class: 'mono muted'}, sj.memname || ''),
      el('td', {}, sj.level), el('td', {class: 'mono'}, preds.join(', ')),
      el('td', {class: 'mono'}, sj.time_from ? sj.time_from + '-' + (sj.time_until || '') : ''),
      el('td', {}, sj.critical ? badge('critical', 'high') : ''),
      el('td', {}, known ? badge('scanned', 'det') : badge('not in scan', 'medium')),
      el('td', {class: 'muted'}, sj.desc || ''));
  })));
if (!tables.length) document.getElementById('schedules').append(el('div', {class: 'empty'},
  'No scheduler input scanned (pass --sched to include schedules and batch chains).'));
toolbar('t-schedules', 'schedules', [['miss', 'jobs (JCL in scan / missing)'], ['table', 'tables'], ['app', 'applications'], ['critical', 'criticality']], 'tbody tr', PAGE);

// ---- inventory: operations (operations.json, recorded verbatim) ------------------------
const operations = (DATA.operations && DATA.operations.tables) || [];
const opsRows = operations.flatMap(t => t.jobs.map(o => ({t, o})));
const opsIncomplete = opsRows.filter(({o}) => o.unknown.length);
const opsCell = v => v
  ? el('td', {class: 'mono', title: 'read from ' + v.source}, v.value)
  : el('td', {class: 'muted'}, 'not stated');
const opsItems = rows => el('ul', {}, ...rows.map(r => el('li', {},
  el('span', {class: 'mono'}, r.kind), ' ', r.detail || '',
  r.source ? el('span', {class: 'cite'}, ' ' + r.source) : null)));
const OPS_COLUMNS = ['', 'Table', 'Job', 'Frequency', 'Window', 'Deadline', 'Not before',
                     'Runtime', 'Rerun / recovery', 'Runs as', 'Execution', 'Not stated'];
intro('operations-intro', [badge('scanner', 'det')], opsRows.length
  ? 'One row per scheduled job: what the scheduler export states about running it. Values are '
    + 'recorded, never evaluated \u2014 a calendar name references an IOA member outside the export, '
    + 'and "not stated" means the export does not carry that fact (' + opsIncomplete.length
    + ' of ' + opsRows.length + ' job(s) are missing at least one), which is an artifact to ask '
    + 'for before a cutover plan can be written.'
  : '');
document.getElementById('operations').append(opsRows.length ? table(OPS_COLUMNS,
  opsRows.flatMap(({t, o}) => {
    const extras = o.alerts.concat(o.trigger_timing.map(tt => ({
      kind: 'trigger ' + tt.condition,
      detail: 'queue ' + (tt.qtm || '-') + ', lead ' + (tt.leadtm || '-')
              + (tt.submtm ? ', submit ' + tt.submtm : '')})));
    const detail = anchorId('ops', t.table + '.' + o.job);
    const row = el('tr', {id: anchorId('opsjob', t.table + '.' + o.job),
                          'data-table': t.table,
                          'data-detail': extras.length ? detail : '',
                          'data-missing': o.unknown.length ? MISSING : 'fully stated'},
      extras.length ? caretCell('show the alerts and trigger timing of ' + o.job)
                    : el('td', {class: 'exp'}, ''),
      el('td', {class: 'mono'}, t.table), el('td', {class: 'mono'}, o.job),
      opsCell(o.frequency), opsCell(o.window), opsCell(o.deadline), opsCell(o.earliest_start),
      opsCell(o.runtime), opsCell(o.rerun), opsCell(o.owner),
      el('td', {class: 'mono muted'},
         Object.entries(o.execution).map(([k, v]) => k + '=' + v).join(' ')),
      el('td', {}, ...o.unknown.map(f => badge(f, 'medium'))));
    if (!extras.length) return [row];
    return [row, el('tr', {class: 'detail', id: detail, hidden: ''},
      el('td', {colspan: OPS_COLUMNS.length}, opsItems(extras)))];
  }))
  : el('div', {class: 'empty'},
      'No scheduler input scanned (pass --sched), so nothing states when these jobs run.'));
if (opsRows.length) toolbar('t-operations', 'operations',
  [['table', 'tables'], ['missing', 'operational facts']], 'tbody tr', PAGE);

// ---- inventory: batch chains (one diagram per scheduler table) ----------------------------
const chainsDiv = document.getElementById('chains');
if (!tables.length) {
  chainsDiv.append(el('div', {class: 'empty'},
    'No scheduler input scanned (pass --sched to include batch chains).'));
}
for (const t of tables) {
  const spec = chainFlows[t.name];
  if (!spec) continue;
  const box = renderFlow(spec, chainLinks(t, chainsByTable[t.name]));
  // what the chain is for, from descriptions.json overviews[] - agent-written,
  // never derived from the catalogs; absent until someone writes it
  const points = overviewPoints('chain', t.name);
  if (points.length) {
    const anchor = box.querySelector('.flow-meta') || box.querySelector('.flow-head');
    anchor.after(el('div', {class: 'flow-meta'}, 'What it does ', badge('agent', 'agent')),
                 el('ul', {class: 'chain-summary',
                           title: ((overviewOf('chain', t.name) || {}).basis || []).join(', ')},
                   ...points.map(p => el('li', {}, p))));
  }
  chainsDiv.append(box);
}

// What scan-chains derived for a table is not repeated here: it is folded into
// the tabs that own each kind of detail, each filterable to this chain.
function chainLinks(t, c) {
  if (!c) return el('div', {},
    'Scheduler-level view only — run scan-chains ' + t.name +
    ' (batch-chain-analysis skill) for steps, data lineage, paths and chain asks.');
  const nSteps = (c.jobs || []).reduce((a, j) => a + (j.steps || []).length, 0);
  const open = (c.asks || []).filter(a => a.status !== 'closed').length;
  const q = '?chain=' + encodeURIComponent(t.name);
  const lineage = (c.lineage || []).length + ' lineage edge(s)';
  const io = (c.inputs || []).length + ' input(s) / ' + (c.outputs || []).length + ' output(s)';
  const line = el('div', {},
    'Analysed by scan-chains' + (c.generated_at ? ' (' + c.generated_at + ')' : '') + ' — ',
    xref('p-jobs' + q + '&open=1', nSteps + ' steps'), ' · ',
    ...(HAS_TRACES
      ? [xref('p-jcltrace' + q, 'JCL trace'), ' · ', xref('p-flow' + q, 'program flow'), ' · ',
         xref('p-lineage' + q, lineage), ' · ', xref('p-lineage' + q, io)]
      : [lineage, ' · ', io]),
    ' · ', findingLink('p-findings' + q, open + ' open ask(s)'));
  if (c.unreached && (c.unreached.programs || []).length)
    line.append(el('div', {}, c.unreached.programs.length + ' batch program(s) of the module reached by no ' +
      t.name + ' step: ', el('span', {class: 'mono muted'}, c.unreached.programs.join(' '))));
  return line;
}

toolbar('t-chains', 'chains', [['miss', 'chains (complete / missing jobs)'], ['analysed', 'analysis depth'], ['app', 'applications'], ['critical', 'criticality']], '.flow-box', 10);

// ---- online: transactions, screens, state, batch boundary (mftb/report/online.py) -------
const online = DATA.online || null;
if (!online) {
  document.getElementById('sec-online').remove();
} else {
  const onlineFlows = (DATA.flows && DATA.flows.online) || {};
  const txByTran = new Map(online.transactions.map(t => [t.transid, t]));
  const cite = s => s ? el('span', {class: 'mono muted'}, s) : null;
  const openAsks = t => (t.asks || []).filter(a => a.status !== 'closed').length;

  // -- transactions: one diagram each, folded behind the TRANID so a region with
  // twenty transactions is a list a reader can scan, with the links into the
  // tabs that own the detail inside. A single transaction opens on arrival -
  // the page is then about that one.
  const txDiv = document.getElementById('transactions');
  for (const t of online.transactions) {
    const spec = onlineFlows[t.transid];
    if (!spec) continue;
    const facets = {class: 'item tx'};
    for (const [k, v] of Object.entries(spec.facets || {})) facets['data-' + k] = v;
    const r = t.resources;
    const asks = openAsks(t);
    txDiv.append(item('tx-' + t.transid, t.transid,
      [badge(t.programs.length + ' program(s)', 'det'),
       t.maps.length ? badge(t.maps.length + ' mapset(s)', 'det') : null,
       t.conversation.pseudo_conversational ? badge('pseudo-conversational', 'gen') : null,
       r.db2.plan ? badge('DB2 PLAN(' + r.db2.plan + ')', 'gen') : null,
       asks ? badge(asks + ' open ask(s)', 'high') : null],
      facets, [renderFlow(spec, txLinks(t))], online.transactions.length === 1));
  }
  if (!online.transactions.length)
    txDiv.append(el('div', {class: 'empty'}, 'No transaction in the store.'));

  function txLinks(t) {
    const q = '?tran=' + encodeURIComponent(t.transid);
    const r = t.resources;
    const line = el('div', {},
      t.programs.length + ' program(s) \u00b7 ' + t.maps.length + ' mapset(s) \u00b7 ' +
      r.files.length + ' file(s), ' + r.ts_queues.length + ' TSQ, ' + r.td_queues.length + ' TDQ' +
      (r.db2.plan ? ' \u00b7 DB2 PLAN(' + r.db2.plan + ')' : '') + ' \u2014 ',
      xref('p-screens' + q, 'screens & state'), ' \u00b7 ',
      findingLink('p-findings' + q, openAsks(t) + ' open ask(s)'));
    if (SCOPE) return line;  // this report *is* the transaction's
    line.append(el('div', {}, 'Transaction report: ',
      el('span', {class: 'mono'}, 'mftb report --module ' + MODULE + ' --transaction ' + t.transid),
      ' \u2192 ', el('a', {class: 'xref', href: 'online/online-' + t.transid + '.html'},
                    'online/online-' + t.transid + '.html')));
    return line;
  }

  // -- entry points: how each transaction starts and what it runs first
  const epRows = online.entry_points.map(e => {
    const t = txByTran.get(e.transid);
    const role = {entry: 'entry point', menu: 'menu', screen: 'screen'}[e.role] || e.role;
    return el('tr', {'data-basis': e.basis, 'data-conv': e.pseudo_conversational ? 'pseudo-conversational' : 'single-shot',
                     'data-role': role,
                     'data-known': e.in_inventory ? 'program in scan' : 'program not in scan'},
      el('td', {class: 'mono'}, el('a', {class: 'xref', href: '#flow-online-' + e.transid}, e.transid)),
      el('td', {}, badge(role, e.role === 'screen' ? 'gen' : 'det'),
         ...(e.reached_by || []).map(r => el('div', {class: 'muted'},
           'from ', el('span', {class: 'mono'}, r.from), ' · ' + r.how + ' in ',
           el('span', {class: 'mono'}, r.program), ' ', cite(r.source)))),
      el('td', {}, badge(e.basis === 'csd' ? 'CSD DEFINE' : e.basis === 'trigger' ? 'TDQ trigger' : 'named by a program',
                         e.basis === 'csd' ? 'det' : 'gen')),
      el('td', {class: 'mono'}, e.program || el('span', {class: 'muted'}, 'unknown'),
         e.program && !e.in_inventory ? ' ' + '\u2014' : null,
         e.program && !e.in_inventory ? badge('not in scan', 'missing') : null),
      el('td', {class: 'num'}, e.programs),
      el('td', {class: 'num'}, e.maps),
      el('td', {}, e.pseudo_conversational
        ? badge('pseudo-conversational', 'det') : el('span', {class: 'muted'}, 'single-shot')),
      el('td', {class: 'num'}, t ? openAsks(t) : 0),
      el('td', {}, cite(e.source)));
  });
  document.getElementById('entrypoints').append(
    table(['TRANID', 'Role', 'Known from', 'Initial program', 'Programs', 'Mapsets', 'Conversation',
           'Open asks', 'Evidence'], epRows));

  // -- screens & state: every mapset use, then the COMMAREA each conversation carries
  const scRows = [];
  for (const t of online.transactions) {
    for (const m of t.maps) for (const u of m.uses)
      scRows.push(el('tr', {'data-tran': t.transid, 'data-dir': u.direction, 'data-mapset': m.mapset,
                            'data-bms': m.bms_source ? 'BMS source scanned' : 'no BMS source'},
        el('td', {class: 'mono'}, t.transid),
        el('td', {class: 'mono'}, m.mapset),
        el('td', {class: 'mono'}, u.map || el('span', {class: 'muted'}, 'whole mapset')),
        el('td', {}, badge(u.direction, u.direction === 'send' ? 'det' : 'gen')),
        el('td', {class: 'mono'}, u.program),
        el('td', {}, m.bms_source ? m.bms_source
          : el('span', {class: 'muted'}, 'not scanned \u2014 fields unknown')),
        el('td', {}, cite(u.source))));
  }
  const screensDiv = document.getElementById('screens');
  screensDiv.append(table(['TRANID', 'Mapset', 'Map', 'Direction', 'Program', 'BMS source', 'Evidence'], scRows));
  const stateRows = online.transactions.filter(t => t.conversation.pseudo_conversational).map(t => {
    const c = t.conversation.commarea;
    return el('tr', {'data-tran': t.transid},
      el('td', {class: 'mono'}, t.transid),
      el('td', {class: 'mono'}, c ? c.item : el('span', {class: 'muted'}, 'no COMMAREA named')),
      el('td', {class: 'num'}, c && c.length ? c.length : el('span', {class: 'muted'}, 'unknown')),
      el('td', {}, ...t.conversation.returns.map(r => el('div', {},
        el('span', {class: 'mono'}, r.program + ' RETURN TRANSID(' + (r.transid || r.variable || '?') + ')'), ' ',
        cite(r.source)))));
  });
  if (stateRows.length) {
    screensDiv.append(el('h4', {}, 'State carried between screens'));
    screensDiv.append(table(['TRANID', 'COMMAREA item', 'Length', 'Returns'], stateRows));
  }

  // -- online <-> batch: TDQ trigger levels, then the datasets both sides touch
  const bDiv = document.getElementById('onbatch');
  const b = online.boundary;
  const trRows = b.triggers.map(t => el('tr', {'data-kind': 'trigger', 'data-tran': t.transid || '(none)'},
    el('td', {class: 'mono'}, t.queue),
    el('td', {class: 'num'}, t.trigger_level),
    el('td', {class: 'mono'}, t.transid || el('span', {class: 'muted'}, 'none')),
    el('td', {}, ...(t.written_by.length
      ? t.written_by.map(w => el('div', {}, el('span', {class: 'mono'}, w.transaction + ' / ' + w.program), ' ', cite(w.source)))
      : [el('span', {class: 'muted'}, 'no scanned online writer')])),
    el('td', {}, cite(t.source))));
  bDiv.append(group('Trigger levels', [badge(b.triggers.length + ' TDQUEUE', 'det')],
    table(['Queue', 'TRIGGERLEVEL', 'Starts', 'Written by', 'Evidence'], trRows), '', true));
  const subs = b.submits || [];
  const suRows = subs.map(s => el('tr', {'data-kind': 'submit', 'data-tran': s.transactions[0] || '(none)'},
    el('td', {class: 'mono'}, s.job || el('span', {class: 'muted'}, 'no JOB card resolved')),
    el('td', {}, ...(s.executes.length
      ? s.executes.map(x => el('div', {}, el('span', {class: 'mono'}, x.kind.toUpperCase() + ' ' + x.name)))
      : [el('span', {class: 'muted'}, 'no EXEC card resolved')])),
    el('td', {class: 'mono'}, (s.transactions.join(', ') || '?') + ' / ' + s.program),
    el('td', {class: 'mono'}, s.queue + (s.ddname ? ' DD ' + s.ddname : '')),
    el('td', {}, s.chain ? badge('chain ' + s.chain, 'chain')
                         : el('span', {class: 'muted'}, 'no scheduler chain')),
    el('td', {}, badge(s.status, s.status === 'resolved' ? 'gen' : 'high'), ' ', cite(s.source))));
  bDiv.append(group('Jobs submitted from CICS', [badge(subs.length + ' submit(s)', 'gen')],
    table(['Job', 'Runs', 'Transaction / program', 'Queue', 'Chain', 'Evidence'], suRows),
    'JCL written to an extrapartition output TDQUEUE: the cards are traced to their literals, ' +
    'but that the DD is the JES internal reader is declared in the region startup JCL, which is ' +
    'not a scanned input — see the cics-internal-reader-unconfirmed ask.', true));
  const dsRows = b.datasets.map(d => el('tr', {'data-kind': 'dataset',
                                               'data-tran': (d.online[0] || {}).transid || '(none)'},
    el('td', {class: 'mono'}, d.dsn),
    el('td', {}, ...d.online.map(o => el('div', {}, el('span', {class: 'mono'}, o.transid + ' ' + o.resource),
                                         ' ', badge(o.direction, o.direction === 'read' ? 'gen' : 'det')))),
    el('td', {}, ...d.batch.map(x => el('div', {}, el('span', {class: 'mono'}, x.job + '.' + x.step + ' ' + x.dd),
                                        x.disp ? ' ' + x.disp : '', x.chain ? ' ' : null,
                                        x.chain ? badge('chain ' + x.chain, 'chain') : null))),
    el('td', {}, el('span', {class: 'muted'}, 'not proven \u2014 see the ask'))));
  bDiv.append(group('Shared datasets', [badge(b.datasets.length + ' dataset(s)', 'gen')],
    table(['DSN', 'Online', 'Batch', 'Order'], dsRows), '', true));

  toolbar('t-transactions', 'transactions',
          [['basis', 'how the TRANID is known'], ['conv', 'conversation'], ['openpgm', 'targets']], '.tx', 10);
  toolbar('t-entrypoints', 'entrypoints',
          [['role', 'roles'], ['basis', 'how the TRANID is known'], ['conv', 'conversation'],
           ['known', 'initial programs']], 'tbody tr', PAGE);
  toolbar('t-screens', 'screens',
          [['tran', 'transactions'], ['dir', 'directions'], ['mapset', 'mapsets'], ['bms', 'BMS source']], 'tbody tr', PAGE);
  toolbar('t-onbatch', 'onbatch', [['kind', 'edges'], ['tran', 'transactions']], 'tbody tr', PAGE);
  intro('online-intro', [badge(online.summary.transactions + ' transactions', 'det'),
                         badge(online.summary.programs_reached + ' programs reached', 'det'),
                         online.summary.programs_unreached
                           ? badge(online.summary.programs_unreached + ' unreached', 'high') : null],
    'Every TRANID, the programs it reaches, the screens and state it carries, and what it shares with batch.');
  tabs('online-tabs', 'online', {Transactions: online.transactions.length,
                                 'Entry points': online.summary.entries + online.summary.menus,
                                 'Screens & state': scRows.length,
                                 'Online \u2194 batch': b.triggers.length + (b.submits || []).length
                                                         + b.datasets.length});
}

// ---- traces: the program-level call graph (traces.json) ----------------------------------
// Nodes are scanned programs, JCL steps and boundaries (what the scan cannot see
// inside); edges are typed and cited transfers of control. Certainty is the
// scanner's, never the reader's guess: proven (written in the source), candidate
// (one of a dynamic site's traced operands), derived (settled by the
// dynamic-call-resolution skill) and open (the site is known, the target is not).
const traceNodes = (DATA.traces && DATA.traces.nodes) || [];
const traceEdges = (DATA.traces && DATA.traces.edges) || [];
const traceRoots = (DATA.traces && DATA.traces.roots) || [];
const traceNode = new Map(traceNodes.map(n => [n.id, n]));
const CERTAINTY_NOTE = {
  proven: 'the target is written in the scanned source (CALL literal, EXEC PGM, EXEC CICS PROGRAM(literal))',
  candidate: 'one of the operands the dynamic-call tracer proved can reach the CALL identifier',
  derived: 'settled by the dynamic-call-resolution skill by cited reasoning over scanned source',
  open: 'the call site is known, the target is not — the graph stops here'};
const REF_KINDS = new Set(['entry-ref', 'cancel']);
// chain of a node: the chains whose steps reach it (roots carry the reachability)
const chainsOfNode = new Map();
const addChainTo = (id, ch) => {
  if (!ch) return;
  if (!chainsOfNode.has(id)) chainsOfNode.set(id, new Set());
  chainsOfNode.get(id).add(ch);
};
for (const r of traceRoots) {
  const ch = r.job ? chainOfJobName(r.job) : '';
  if (r.job) addChainTo(r.job + '.' + r.step, ch);
  for (const x of (r.reaches || [])) addChainTo(x.node, ch);
}
const chainOfNode = id => [...(chainsOfNode.get(id) || [])].sort().join(' ');
const traceChains = [...new Set(traceNodes.map(n => chainOfNode(n.id)).filter(Boolean))].sort();
const edgeChain = e => chainOfNode(e.from) || chainOfNode(e.to);
// artifacts the scan was never given (a PROC/INCLUDE/JCL member, a program no
// scanned source defines, a dynamic target nothing names): drawn red
const MISSING_CLASSES = new Set(['absent-proc', 'absent-jcl', 'absent-include',
                                 'unsupplied-module', 'unresolved-target']);
const isMissing = n => !!n && n.kind === 'boundary' && MISSING_CLASSES.has(n.class);
const nodeSub = n => n.kind === 'step' ? 'step · ' + (n.class || '')
  : n.kind === 'job' ? 'job · JCL'
  : n.kind === 'schedule' ? 'scheduler table'
  : n.kind === 'boundary' ? (isMissing(n) ? 'missing · ' + n.class : (n.class || 'boundary'))
  : (n.cics ? 'program · CICS' : 'program');

// ---- traces: program-flow diagram --------------------------------------------------------
// Layered top-down: JCL steps (or the roots of the filtered graph) on top, each
// edge dropping one layer. Cycles cannot extend a layer past the node count, so
// the relaxation always terminates.
function layoutFlow(ids, edges) {
  const layer = new Map(ids.map(i => [i, 0]));
  for (let pass = 0; pass < ids.length; pass++) {
    let moved = false;
    for (const e of edges) {
      if (!layer.has(e.from) || !layer.has(e.to)) continue;
      if (layer.get(e.to) < layer.get(e.from) + 1) { layer.set(e.to, layer.get(e.from) + 1); moved = true; }
    }
    if (!moved) break;
  }
  const rows = new Map();
  for (const id of ids) {
    const l = layer.get(id);
    if (!rows.has(l)) rows.set(l, []);
    rows.get(l).push(id);
  }
  const W = 148, H = 38, GX = 18, GY = 54;
  const pos = new Map();
  const order = [...rows.keys()].sort((a, b) => a - b);
  const parents = new Map(ids.map(i => [i, []]));
  for (const e of edges) if (parents.has(e.to)) parents.get(e.to).push(e.from);
  let width = 0;
  for (const l of order) {
    const row = rows.get(l);
    row.sort((a, b) => {
      const px = n => {
        const ps = parents.get(n).map(p => pos.has(p) ? pos.get(p).x : null).filter(v => v != null);
        return ps.length ? ps.reduce((x, y) => x + y, 0) / ps.length : 1e9;
      };
      return px(a) - px(b) || a.localeCompare(b);
    });
    row.forEach((id, i) => pos.set(id, {x: 20 + i * (W + GX), y: 20 + l * (H + GY)}));
    width = Math.max(width, 40 + row.length * (W + GX));
  }
  return {pos: pos, W: W, H: H, width: width, height: 40 + order.length * (H + GY)};
}

const SVGNS = 'http://www.w3.org/2000/svg';
const svgEl = (tag, attrs, text) => {
  const e = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v != null) e.setAttribute(k, v);
  if (text != null) e.textContent = text;
  return e;
};

  el('span', {class: 'k open', title: CERTAINTY_NOTE.open}, 'open — target unknown'),
  el('span', {class: 'k missing', title: 'an artifact the scan was never given: a PROC or INCLUDE member, a scheduled JCL member, or a program no scanned source defines'},
     'red box = missing artifact (PROC / JCL / INCLUDE / program)'),
  el('span', {}, 'dashed box = boundary of the scan (external module, runtime routine, utility, DB2 procedure, IMS/IDMS interface, CICS remote)'),
  el('span', {}, 'click a node for its cited edges'));

const cDyn = cbox('dynamic edges', true, 'candidate and derived targets of CALL identifier / LINK PROGRAM(var)');
const cOpen = cbox('open ends', true, 'sites whose target the scan cannot name');
const cRefs = cbox('references', false, 'SET ... TO ENTRY and CANCEL: a reference to a program, not a transfer of control');
const cRuntime = cbox('runtime & utilities', false, 'IBM/CICS runtime routines, utilities and build tools');

function flowFilter() {
  const scope = scopeSel.value;
  let edges = traceEdges.filter(e => {
    if (!cSteps.input.checked && e.kind === 'jcl-exec') return false;
    if (!cDyn.input.checked && (e.certainty === 'candidate' || e.certainty === 'derived')) return false;
    if (!cOpen.input.checked && e.certainty === 'open') return false;
    if (!cRefs.input.checked && REF_KINDS.has(e.kind)) return false;
    const to = traceNode.get(e.to);
    if (!cRuntime.input.checked && to && ['runtime-routine', 'utility', 'build-tool'].includes(to.class)) return false;
    if (!cMissing.input.checked && isMissing(to)) return false;
    return true;
  });
  if (scope.startsWith('chain:')) {
    const ch = scope.slice(6);
    edges = edges.filter(e => (chainsOfNode.get(e.from) || new Set()).has(ch) ||
                              (chainsOfNode.get(e.to) || new Set()).has(ch));
  } else if (scope.startsWith('root:')) {
    const start = scope.slice(5);
    const out = new Map();
    for (const e of edges) { if (!out.has(e.from)) out.set(e.from, []); out.get(e.from).push(e); }
    const keep = new Set(), queue = [start], seen = new Set([start]);
    while (queue.length) {
      for (const e of (out.get(queue.shift()) || [])) {
        keep.add(e);
        if (!seen.has(e.to)) { seen.add(e.to); queue.push(e.to); }
      }
    }
    edges = edges.filter(e => keep.has(e));
  }
  return edges;
}

function drawFlow() {
  flowDiv.textContent = '';
  flowDetail.textContent = '';
  const edges = flowFilter();
  const ids = [...new Set(edges.flatMap(e => [e.from, e.to]))].filter(id => traceNode.has(id));
  if (!ids.length) {
    flowDiv.append(el('div', {class: 'empty'}, traceNodes.length
      ? 'Nothing to draw with these filters.'
      : 'No traces.json in the store — run scan-traces (or a full scan) to build the call graph.'));
    return;
  }
  const lay = layoutFlow(ids, edges);
  const svg = svgEl('svg', {class: 'flow', width: lay.width, height: lay.height,
                            viewBox: '0 0 ' + lay.width + ' ' + lay.height});
  const defs = svgEl('defs');
  for (const [name, color] of [['proven', '#1e8449'], ['candidate', '#b9770e'], ['derived', '#b9770e'],
                               ['open', '#c0392b']]) {
    const mk = svgEl('marker', {id: 'ar-' + name, viewBox: '0 0 8 8', refX: 7, refY: 4,
                                markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse'});
    mk.append(svgEl('path', {d: 'M0,0 L8,4 L0,8 z', fill: color}));
    defs.append(mk);
  }
  svg.append(defs);
  const paths = new Map();  // node id -> [path elements]
  const gEdges = svgEl('g');
  for (const e of edges) {
    const a = lay.pos.get(e.from), b = lay.pos.get(e.to);
    if (!a || !b) continue;
    const x1 = a.x + lay.W / 2, y1 = a.y + lay.H, x2 = b.x + lay.W / 2, y2 = b.y;
    const p = svgEl('path', {class: 'edge ' + e.certainty,
      d: 'M' + x1 + ',' + y1 + ' C' + x1 + ',' + (y1 + 26) + ' ' + x2 + ',' + (y2 - 26) + ' ' + x2 + ',' + y2,
      'marker-end': 'url(#ar-' + e.certainty + ')'});
    p.append(svgEl('title', {}, (e.detail || e.kind) + ' — ' + e.source));
    gEdges.append(p);
    for (const id of [e.from, e.to]) {
      if (!paths.has(id)) paths.set(id, []);
      paths.get(id).push(p);
    }
  }
  svg.append(gEdges);
  const groups = new Map();
  for (const id of ids) {
    const n = traceNode.get(id), p = lay.pos.get(id);
    const g = svgEl('g', {class: 'node'});
    g.append(svgEl('rect', {class: 'nbox ' + n.kind + ' ' + (n.class || ''), x: p.x, y: p.y,
                            width: lay.W, height: lay.H, rx: 6}));
    const label = id.length > 20 ? id.slice(0, 19) + '…' : id;
    g.append(svgEl('text', {class: 'nlabel' + (isMissing(n) ? ' missing' : ''),
                            x: p.x + 9, y: p.y + 16}, label));
    g.append(svgEl('text', {class: 'nsub', x: p.x + 9, y: p.y + 29}, nodeSub(n)));
    g.append(svgEl('title', {}, id + (n.detail ? ' — ' + n.detail : '')));
    g.addEventListener('click', () => selectNode(id));
    groups.set(id, g);
    svg.append(g);
  }
  flowDiv.append(svg);

  function selectNode(id) {
    for (const [nid, g] of groups) g.classList.toggle('dim', nid !== id);
    for (const [nid, g] of groups) g.classList.toggle('sel', nid === id);
    const mine = new Set(paths.get(id) || []);
    for (const p of gEdges.children) p.classList.toggle('dim', !mine.has(p));
    const n = traceNode.get(id);
    const rows = edges.filter(e => e.from === id || e.to === id).map(e => el('tr', {},
      el('td', {}, e.from === id ? '→ out' : '← in'),
      el('td', {class: 'mono'}, e.from === id ? e.to : e.from),
      el('td', {}, badge(e.kind, 'trace')),
      el('td', {}, badge(e.certainty, e.certainty), ' ',
        e.blocked_by ? findingLink('p-findings?kind=' + encodeURIComponent(e.blocked_by), e.blocked_by,
                            'the finding that carries this open question') : null),
      el('td', {}, e.detail || ''),
      el('td', {class: 'mono muted'}, [e.source, ...(e.evidence || [])].join('\n'))));
    flowDetail.textContent = '';
    flowDetail.append(el('h4', {}, id + ' — ' + nodeSub(n) + (n.detail ? ' (' + n.detail + ')' : '')),
      table(['Direction', 'Node', 'Kind', 'Certainty', 'What', 'Cited at'], rows));
  }
}

// ---- traces: JCL trace (job → step → program → DD → dataset) ------------------------

const reachOf = new Map();  // step id -> [{node, depth}] beyond the step itself

// ---- site & environment ----------------------------------------------------
const profile = DATA.profile || null;
if (!profile) {
  document.getElementById('sec-profile').remove();
} else {
  const psite = profile.site || {};
  const siteNames = Object.keys(psite);
  const nDefault = siteNames.filter(n => psite[n].source === 'default').length;
  const nOpen = siteNames.filter(n => psite[n].value == null).length;
  const nContra = siteNames.filter(n => psite[n].contradicted_by).length;
  const SRC = {detected: 'the store proves it', answered: 'a person answered it for this module',
               inherited: 'carried in from the estate profile note',
               default: 'nobody said: mftb assumed it'};
  // "database systems", not "managers": the product that manages the data is
  // the same word the rest of the report uses for the system itself.
  const LABELS = {database_managers: 'Database systems', zos_version: 'z/OS version',
                  test_lpar: 'Test LPAR'};
  const label = n => LABELS[n] || n.replace(/_/g, ' ').replace(/^./, c => c.toUpperCase());

  const evidenceCell = f => {
    if (f.source === 'default') return el('td', {class: 'muted note'}, 'none — an assumption is never evidence');
    if (!f.evidence.length) return el('td', {class: 'muted note'}, '—');
    return el('td', {class: 'note'}, el('ul', {class: 'evidence'},
      ...f.evidence.slice(0, 6).map(e => el('li', {}, el('span', {class: 'mono'}, e))),
      f.evidence.length > 6 ? el('li', {class: 'muted'}, '+' + (f.evidence.length - 6) + ' more') : null));
  };
  const valueCell = f => {
    const bits = [f.value == null ? el('span', {class: 'muted'}, 'not answered') : f.value];
    for (const p of f.products || []) {
      if (!p.version) continue;
      bits.push(' ', badge(p.version + ' (' + p.version_source + ')', 'runtime'));
    }
    if (f.contradicted_by) bits.push(el('div', {class: 'request'},
      'contradicted by this module: ' + f.contradicted_by.value + ' — ' + f.contradicted_by.basis));
    return el('td', {}, ...bits);
  };
  const row = name => {
    const f = psite[name];
    const tr = el('tr', f.source === 'default' ? {class: 'missing'} : {},
      el('td', {}, el('strong', {}, label(name))),
      valueCell(f),
      el('td', {}, badge(f.source || 'unanswered', f.source || 'open'),
         f.source === 'default' ? ' ' : null,
         f.source === 'default' ? badge('ASSUMED', 'high') : null),
      el('td', {}, badge(f.confidence, f.confidence === 'proven' ? 'proven'
        : f.confidence === 'asserted' ? 'confirmed' : f.confidence === 'derived' ? 'derived' : 'unknown')),
      evidenceCell(f));
    if (f.basis) tr.children[1].append(el('div', {class: 'note'}, f.basis));
    return tr;
  };

  const body = el('div', {},
    el('p', {class: 'note', style: 'margin:10px 14px'},
      'What the estate runs, as far as this module’s store can prove it. ' +
      'A value is only as good as its source: ' +
      Object.entries(SRC).map(([k, v]) => k + ' = ' + v).join('; ') + '. ' +
      'Defaults come from mftb’s typical-z/OS-shop table and confirm nothing — every one of them ' +
      'is still an open question in Findings.'),
    table([['Field'], ['Value'], ['Source'], ['Confidence'], ['Read from']].map(h => h[0]),
          siteNames.map(row)));

  // the site layer's own counts: psum spans the module layer too, which this
  // section does not draw (what this module connects to is Connections' subject)
  const nSource = s => siteNames.filter(n => psite[n].source === s).length;
  const counts = [];
  for (const s of ['detected', 'answered', 'inherited'])
    if (nSource(s)) counts.push(nSource(s) + ' ' + s);
  if (nDefault) counts.push(nDefault + ' assumed');
  if (nOpen) counts.push(nOpen + ' unanswered');
  const d = el('details', {class: 'group', id: 'profile-box'},
    el('summary', {}, 'Site & environment',
      nDefault ? badge(nDefault + ' assumed from mftb defaults', 'high') : null,
      nContra ? badge(nContra + ' contradicted', 'high') : null,
      el('span', {class: 'spacer'}),
      el('span', {class: 'n'}, counts.join(', '))),
    body);
  document.getElementById('sec-profile').append(d);
}

// Tab counts are what is in the scan; the missing rows are counted separately
// and reported next to them in the summary.
const missingSteps = steps.filter(s => ['unresolved', 'unsupplied-module'].includes(stepStatuses.get(s).cls));
const chainsWithMissing = tables.filter(t => t.jobs.some(sj => !(scannedJobs.has(sj.name) || scannedJobs.has(sj.memname))));
const invCounts = {Programs: progRows.length, Copybooks: copybooks.length, Jobs: jobs.length, Steps: steps.length,
                   PROCs: procNames.length, Schedules: schedRows.length, Operations: opsRows.length,
                   'Batch chains': tables.length};
const invMissing = {Programs: missingProgramRows.length, Copybooks: missingCopybooks.length, Jobs: missingJobs.length,
                    Steps: missingSteps.length, PROCs: missingProcs.filter(n => !procNames.includes(n)).length + new Set(missingIncludes.map(m => m.member)).size,
                    Schedules: missingJobs.length, Operations: opsIncomplete.length,
                    'Batch chains': chainsWithMissing.length};
tabs('inv-tabs', 'inv', invCounts);
if (SCOPE) PANEL_SHOW.get(document.getElementById(SCOPE.kind === 'transaction' ? 'p-transactions' : 'p-chains'))();

// ---- summary --------------------------------------------------------------------------
// Four tables in the style of Source lines: inventory (the tab counts, verbatim,
// plus what is referenced but missing from the scan), connections (only the
// database types that were actually found; absence is spelled out in the Database
// systems tab), resolution status, and source lines per file type (from each
// scanner's `sources`). A row is omitted when its input was not scanned. Every
// row links to its tab; a Missing count links to the tab filtered to those rows.
const fmt = n => Number(n).toLocaleString('en-US');
const sgroup = (title, cls, ...body) => el('div', {class: 'sgroup ' + (cls || '')}, el('h3', {}, title), ...body);
const summaryDiv = document.getElementById('summary');
const hasSched = !!DATA.schedule;
const cell = (v, cls) => el('td', {class: cls || ''},
  v == null ? '' : typeof v === 'number' ? fmt(v) : v);
const link = (text, href) => el('a', {class: 'xref', href}, text);
const missingCell = (n, href) => n
  ? el('td', {class: 'num alert'}, link(fmt(n), href))
  : el('td', {class: 'num muted'}, '0');
const stable = (headers, rows) => el('table', {class: 'loc'},
  el('thead', {}, el('tr', {}, ...headers.map(([h, cls]) => el('th', {class: cls || ''}, h)))),
  el('tbody', {}, ...rows.filter(Boolean)));

// the Missing link opens the tab with its `miss` facet preselected (revealHash);
// a row whose item is not the tab's row (steps live under Jobs) names the facet
// that selects it and asks for the matching rows to be expanded
const invRow = (label, panel, count, missing, what, facet, open) => el('tr', {},
  cell(link(label, '#' + panel)), cell(count, 'num'),
  missingCell(missing, '#' + panel + '?' + (facet || 'miss') + '=' + encodeURIComponent(MISSING) + (open ? '&open=1' : '')),
  cell(what, 'muted note'));
const nMissProcOnly = missingProcs.filter(n => !procNames.includes(n)).length;
const nMissInc = new Set(missingIncludes.map(m => m.member)).size;
summaryDiv.append(sgroup('Inventory', '', stable(
  [['Item'], ['In scan', 'num'], ['Missing', 'num'], ['Missing means', 'note']], [
  invRow('Programs', 'p-programs', invCounts.Programs, invMissing.Programs, 'CALL / LINK / EXEC PGM target with no scanned source'),
  invRow('Copybooks', 'p-copybooks', invCounts.Copybooks, invMissing.Copybooks, 'COPY / INCLUDE member no scanned copybook defines'),
  invRow('Jobs', 'p-jobs', invCounts.Jobs, invMissing.Jobs, 'scheduled job with no scanned JCL member'),
  invRow('Steps', 'p-jobs', invCounts.Steps, invMissing.Steps,
         missingSteps.length
           ? [unresolvedSteps.length ? fmt(unresolvedSteps.length) + ' unresolved (missing PROC / symbolic / control cards)' : null,
              missingSteps.length > unresolvedSteps.length ? fmt(missingSteps.length - unresolvedSteps.length) + ' run a program not in scan' : null]
             .filter(Boolean).join('; ')
           : 'every step resolves to a scanned program, a utility or a launcher',
         'stepmiss', true),
  invRow('PROCs', 'p-procs', invCounts.PROCs, invMissing.PROCs,
         [nMissProcOnly ? fmt(nMissProcOnly) + ' EXECed PROC' : null, nMissInc ? fmt(nMissInc) + ' JCL INCLUDE member' : null]
           .filter(Boolean).join(', ') + (nMissProcOnly || nMissInc ? ' not in any scanned library' : 'every EXEC PROC= and INCLUDE resolved')),
  hasSched ? invRow('Schedules', 'p-schedules', invCounts.Schedules, invMissing.Schedules, 'scheduled job whose JCL is not in scan') : null,
  hasSched ? invRow('Operations', 'p-operations', invCounts.Operations, invMissing.Operations,
                    'scheduled job whose export does not state its frequency, window, deadline, runtime, rerun policy or owner',
                    'missing') : null,
  hasSched ? invRow('Batch chains', 'p-chains', invCounts['Batch chains'], invMissing['Batch chains'], 'chain with at least one job not in scan') : null,
])));

// source lines per file type: one row per kind that was scanned, then a total
const SOURCE_KINDS = [
  ['program', 'COBOL programs'], ['copybook', 'Copybooks'], ['jcl', 'JCL (job members)'],
  ['proc', 'PROCs'], ['include', 'JCL include / control members'],
  ['cntl', 'Control-card members'],
  ['sched', 'Scheduler exports'], ['sql', 'DB2 DDL / SQL'],
];
const allSources = ['programs', 'jobs', 'schedule', 'db2seed']
  .flatMap(k => (DATA[k] && DATA[k].sources) || []);
const locRows = SOURCE_KINDS.map(([kind, label]) => {
  const ss = allSources.filter(s => s.kind === kind);
  return ss.length ? {label, files: ss.length,
    lines: ss.reduce((a, s) => a + s.lines, 0), code: ss.reduce((a, s) => a + s.code_lines, 0)} : null;
}).filter(Boolean);
const locRow = (r, cls) => el('tr', {class: cls || ''}, el('td', {}, r.label),
  el('td', {class: 'num'}, fmt(r.files)), el('td', {class: 'num'}, fmt(r.lines)), el('td', {class: 'num'}, fmt(r.code)));
const locTotal = {label: 'Total', files: locRows.reduce((a, r) => a + r.files, 0),
  lines: locRows.reduce((a, r) => a + r.lines, 0), code: locRows.reduce((a, r) => a + r.code, 0)};
const locGroup = sgroup('Source lines', 'wide',
  locRows.length ? el('table', {class: 'loc'},
    el('thead', {}, el('tr', {}, el('th', {}, 'File type'), el('th', {class: 'num'}, 'Files'),
                                 el('th', {class: 'num'}, 'Lines'), el('th', {class: 'num'}, 'Code lines'))),
    el('tbody', {}, ...locRows.map(r => locRow(r)), locRow(locTotal, 'total')))
  : el('div', {class: 'empty'}, 'Scanner output predates source-line counting; re-run the scan.'),
  el('div', {class: 's muted'}, 'Code lines exclude blank and comment lines (COBOL: comment lines and Panvalet/Librarian directives; JCL: //* lines; SQL: -- lines; scheduler: * lines).'));

if (conn) {
  const cs = conn.summary;
  const dbms = conn.dbms && conn.dbms.db2 && conn.dbms.ims && conn.dbms.idms ? conn.dbms : null;
  const dbTypes = dbms ? [
    dbms.db2.present ? 'DB2 (' + fmt(dbms.db2.programs.length) + ' pgm)' : null,
    dbms.ims.present ? 'IMS DB (' + fmt(dbms.ims.programs.length) + ' pgm)' : null,
    dbms.idms.present ? 'IDMS (' + fmt(dbms.idms.programs.length) + ' pgm)' : null,
  ].filter(Boolean) : [];
  const extNames = (conn.external.modules || []).map(m => m.name);
  const nExt = extNames.length;
  const nCicsRes = cs.cics_files + cs.cics_ts_queues + cs.cics_td_queues;
  const connRow = (label, panel, count, note, alert) => el('tr', {},
    cell(link(label, '#' + panel)), cell(count, 'num'), cell(note, (alert ? 'alert' : 'muted') + ' note'));
  summaryDiv.append(sgroup('Connections', '', stable(
    [['Touch point'], ['Count', 'num'], ['Note', 'note']], [
    connRow('Database types', 'p-dbms', dbTypes.length,
            dbTypes.length ? dbTypes.join(' · ') : 'none found — no EXEC SQL / DLI / IDMS in any scanned program'),
    dbms && dbms.db2.present ? connRow('DB2 tables', 'p-db2', cs.db2_tables, fmt(cs.sql_statements) + ' SQL statements') : null,
    connRow('Datasets', 'p-datasets', cs.datasets,
            cs.vsam_defined ? fmt(cs.vsam_defined) + ' VSAM defined by IDCAMS' : 'no IDCAMS DEFINE in scan'),
    connRow('COBOL files', 'p-datasets?kind=' + encodeURIComponent('COBOL file without DSN'), cs.files,
            cs.files_unbound ? fmt(cs.files_unbound) + ' without a DSN (no scanned JCL binds the DD) — listed under Datasets' : 'all bound to a DSN', cs.files_unbound),
    cs.cics_commands ? connRow('CICS resources', 'p-cics', nCicsRes, fmt(cs.cics_program_links) + ' program links') : null,
    cs.mq_calls ? connRow('MQ calls', 'p-runtime', cs.mq_calls, null) : null,
    connRow('External modules', 'p-external', nExt, nExt ? extNames.join(', ') + ' — not in this scan' : 'every named target is in the scan', nExt),
  ])));
}

const openHigh = findings.filter(f => f.severity === 'high').length;
const unresolvedSites = dcPartial + dcOpen;
const resRow = (label, href, count, note, alert) => el('tr', {},
  cell(link(label, href)), cell(count, 'num'), cell(note, (alert ? 'alert' : 'muted') + ' note'));
summaryDiv.append(sgroup('Resolution', '', stable(
  [['Status'], ['Count', 'num'], ['Note', 'note']], [
  resRow('Dynamic calls', '#p-dyncalls', sites.length,
         sites.length ? fmt(dcResolved) + ' resolved · ' + fmt(dcPartial) + ' partial · ' + fmt(dcOpen)
                        + ' open — every site, its ladder and what it resolves to'
                      : 'no dynamic CALL / CANCEL / SET TO ENTRY / SQL CALL / CICS LINK|XCTL', unresolvedSites),
  SHOW_FINDINGS ? resRow('Open findings', '#p-findings', findings.length,
         openHigh ? fmt(openHigh) + ' high — evidence requests' : 'none high', openHigh) : null,
  SHOW_FINDINGS ? resRow('Closed findings', '#p-closed', closed.length,
         closed.length ? 'settled by the scanner or a skill, with the closing evidence' : null) : null,
  hasSched && tables.length ? resRow('Batch chains analysed', '#p-chains', Object.keys(chainsByTable).length,
         Object.keys(chainsByTable).length ? 'scan-chains: steps, lineage, paths and chain asks per table' : 'none — run scan-chains <TABLE> for lineage and chain asks',
         !Object.keys(chainsByTable).length) : null,
])));
summaryDiv.append(locGroup);
revealHash();
</script>
</body>
</html>
